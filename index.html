<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#6b1f2c"/>
  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="АйЯ Prosalon"/>
  <link rel="apple-touch-icon" href="./icon-192.png"/>
  <!-- PWA manifest -->
  <link rel="manifest" href="./manifest.webmanifest"/>
  <title>Prosalon · АйЯ-эксперт</title>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet"/>
  <style>
/* Prosalon · АйЯ-эксперт — design tokens
   Cosmetic salon palette: champagne, deep wine, warm rose-gold */
:root {
  /* light theme only */
  --bg:           #f4ece1;
  --bg-soft:      #ebe0d0;
  --bg-card:      #fbf6ed;
  --bg-elevated:  #ffffff;
  --bg-overlay:   rgba(34, 18, 22, 0.45);

  --ink:          #2a151a;
  --ink-2:        #4f3239;
  --ink-3:        #836870;
  --ink-4:        #b39ea4;

  --line:         #e6d4c0;
  --line-strong:  #cdb39a;

  /* Prosalon-Bordeaux primary */
  --wine:         #6b1f2c;
  --wine-deep:    #4d1320;
  --wine-soft:    #f0d4d8;
  --wine-wash:    #f7e3e3;

  --rose-gold:    #c08868;
  --rose-soft:    #f3dccd;
  --rose-wash:    #faead8;

  --gold:         #b08841;
  --gold-soft:    #ecd4a4;
  --gold-wash:    #f6e7c8;

  --warn:         #d99845;
  --warn-wash:    #f8e4c1;
  --danger:       #c25548;
  --danger-wash:  #f5d8d3;
  --success:      #6f9763;
  --success-wash: #dde8d3;
  --info:         #6f8aa6;
  --info-wash:    #dde6ee;

  --font-sans:    'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-display: 'Cormorant Garamond', 'Times New Roman', serif;

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  --sh-1: 0 1px 0 rgba(43,21,26,0.04), 0 2px 6px rgba(43,21,26,0.05);
  --sh-2: 0 4px 12px rgba(43,21,26,0.07), 0 12px 28px rgba(43,21,26,0.08);
  --sh-3: 0 12px 32px rgba(43,21,26,0.12), 0 32px 64px rgba(43,21,26,0.10);

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html {
  margin: 0;
  background: #ece1d4;
  height: 100%;
}
body {
  margin: 0;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  min-height: 100dvh;
}
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }

/* Real mobile-first site — no phone frame */
.phone { display: contents; }
.phone-inner { display: contents; }
.status-bar { display: none; }

/* Screen — full page scrollable */
.screen {
  width: 100%;
  min-height: calc(100dvh - 72px);
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 16px 100px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding-top: max(12px, env(safe-area-inset-top));
}
.screen::-webkit-scrollbar { display: none; }

.appbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0 4px;
  min-height: 36px;
}
.appbar .icons button {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink);
}
.appbar .back {
  height: 40px;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
  padding: 0 14px 0 8px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 600;
}
.appbar .back:active, .appbar .icons button:active { background: var(--bg-soft); }

.page-head { padding: 8px 4px 4px; }
.page-head h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 32px;
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  color: var(--ink);
}
.page-head h1 em {
  font-style: italic;
  font-weight: 500;
  color: var(--wine);
}
.page-head .sub {
  font-size: 14px;
  color: var(--ink-3);
  margin: 0;
  line-height: 1.4;
}

.card {
  background: var(--bg-card);
  border-radius: var(--r-lg);
  padding: 20px;
  box-shadow: var(--sh-1);
  border: 1px solid var(--line);
}
.card-elev {
  background: var(--bg-elevated);
  border-radius: var(--r-md);
  padding: 16px;
  border: 1px solid var(--line);
}

/* Buttons — bigger for one-hand */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 56px;
  padding: 0 24px;
  border-radius: var(--r-pill);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
  transition: transform 80ms var(--ease), background 120ms var(--ease);
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn-primary {
  background: var(--wine);
  color: #fff;
}
.btn-primary:active { background: var(--wine-deep); }
.btn-ghost {
  background: var(--bg-card);
  color: var(--ink);
  border: 1px solid var(--line-strong);
}
.btn-ghost:active { background: var(--bg-soft); }
.btn-text {
  color: var(--wine);
  font-weight: 600;
  background: transparent;
}
.btn-block { width: 100%; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 14px;
  border-radius: var(--r-pill);
  background: var(--bg-soft);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.chip.active {
  background: var(--wine-wash);
  color: var(--wine);
  border-color: var(--wine-soft);
}
.chip.gold.active {
  background: var(--gold-wash);
  color: var(--gold);
  border-color: var(--gold-soft);
}

/* Inputs */
.field {
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 16px;
  border-radius: var(--r-md);
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  font-size: 16px;
  color: var(--ink);
  width: 100%;
}
.field::placeholder { color: var(--ink-4); }
.field-lg { height: 60px; font-size: 17px; }

textarea.field {
  height: auto;
  min-height: 88px;
  padding: 14px 16px;
  resize: none;
  line-height: 1.5;
}

label.lbl {
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-2);
  display: block;
  margin-bottom: 8px;
  letter-spacing: 0.01em;
}

/* Recipe */
.recipe-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.recipe-row:last-child { border-bottom: 0; }
.recipe-row .l {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px;
  flex: 1;
}
.recipe-row .l .ico {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--wine-wash);
  color: var(--wine);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.recipe-row .r {
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  text-align: right;
}

/* Tip */
.tip {
  display: flex;
  gap: 10px;
  padding: 14px;
  border-radius: var(--r-md);
  background: var(--gold-wash);
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.45;
  border: 1px solid var(--gold-soft);
}
.tip.warn { background: var(--warn-wash); border-color: #ebd29c; }
.tip.success { background: var(--success-wash); border-color: #c4d4b3; }
.tip.danger { background: var(--danger-wash); border-color: #ecbeb6; }
.tip.info { background: var(--info-wash); border-color: #b9c8d8; }

.dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  bottom: 72px;
  padding: 12px 20px 16px;
  background: linear-gradient(to top, var(--bg) 60%, transparent);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 90;
  pointer-events: none;
}
.dock > * { pointer-events: auto; }

.tabbar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--bg-elevated);
  border-top: 1px solid var(--line);
  display: flex;
  padding: 8px 4px max(14px, env(safe-area-inset-bottom));
  z-index: 100;
  box-shadow: 0 -4px 16px rgba(43,21,26,0.06);
}
.tabbar .tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  padding: 4px 2px;
  border-radius: 12px;
  position: relative;
}
.tabbar .tab.active { color: var(--wine); }
.tabbar .tab svg { width: 24px; height: 24px; }
.tabbar .tab .badge {
  position: absolute;
  top: 0; right: calc(50% - 18px);
  min-width: 16px; height: 16px;
  background: var(--wine);
  color: #fff;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  border: 1.5px solid var(--bg-elevated);
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.01em;
  color: var(--wine);
}
.brand-mark .pro {
  font-style: normal;
  font-family: var(--font-sans);
  font-weight: 800;
  font-size: 11px;
  letter-spacing: 0.18em;
  background: var(--wine);
  color: #fff;
  padding: 3px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}

/* hue / level swatches */
.hue-row {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  margin-top: 8px;
}
.hue {
  flex: 1;
  height: 40px;
  border-radius: var(--r-sm);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,0.85);
  padding-bottom: 4px;
  position: relative;
  cursor: pointer;
}
.hue.active::after {
  content: "";
  position: absolute;
  inset: -3px;
  border: 2px solid var(--wine);
  border-radius: calc(var(--r-sm) + 2px);
}

/* Range slider */
.range {
  appearance: none;
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: var(--line);
  border-radius: var(--r-pill);
  outline: none;
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--wine);
  border: 3px solid #fff;
  box-shadow: 0 2px 6px rgba(43,21,26,0.25);
  cursor: pointer;
}

.progress {
  height: 6px;
  background: var(--bg-soft);
  border-radius: var(--r-pill);
  overflow: hidden;
}
.progress > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--wine), var(--rose-gold));
  border-radius: inherit;
}

.icon-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--bg-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-2);
}

.section-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--wine);
  margin: 4px 4px 0;
}

.kv {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.kv:last-child { border-bottom: 0; }
.kv .ic {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  color: var(--wine);
  flex-shrink: 0;
}
.kv .lbl-tt { color: var(--ink-3); font-size: 12px; line-height: 1.2; margin-bottom: 2px; }
.lbl-tt { color: var(--ink-3); font-size: 12px; line-height: 1.2; margin-bottom: 2px; }
.kv .vl { font-weight: 600; }

.opt-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}
.opt {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 120ms var(--ease);
}
.opt.active {
  background: var(--wine-wash);
  border-color: var(--wine);
  color: var(--wine);
  box-shadow: 0 0 0 3px var(--wine-wash) inset;
}
.opt .ico { font-size: 22px; margin-bottom: 4px; display: block; }

.minitabs {
  display: flex;
  gap: 4px;
  background: var(--bg-soft);
  padding: 4px;
  border-radius: var(--r-pill);
}
.minitabs button {
  flex: 1;
  height: 38px;
  border-radius: var(--r-pill);
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-3);
}
.minitabs button.active {
  background: var(--bg-elevated);
  color: var(--wine);
  box-shadow: var(--sh-1);
}

/* Bottle product card */
.product-tile {
  background: var(--bg-card);
  border-radius: var(--r-md);
  padding: 14px;
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
}
.product-tile .bottle {
  width: 100%;
  aspect-ratio: 1;
  border-radius: var(--r-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.product-tile .name {
  font-weight: 700;
  font-size: 14px;
  line-height: 1.2;
}
.product-tile .desc {
  font-size: 11px;
  color: var(--ink-3);
  line-height: 1.3;
}

/* Risk row */
.risk {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px 0;
  border-bottom: 1px dashed var(--line);
}
.risk:last-child { border-bottom: 0; }
.risk-icon {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 14px;
  font-weight: 700;
}
.risk-icon.danger { background: var(--danger-wash); color: var(--danger); }
.risk-icon.warn { background: var(--warn-wash); color: var(--warn); }
.risk-icon.info { background: var(--info-wash); color: var(--info); }
.risk-text { font-size: 14px; line-height: 1.45; flex: 1; }

/* Toggle radio */
.radio {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 15px;
  color: var(--ink);
}
.radio .dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  border: 2px solid var(--line-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.radio.checked .dot { border-color: var(--wine); }
.radio.checked .dot::after {
  content: "";
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--wine);
}

.check {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  cursor: pointer;
}
.check .box {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid var(--line-strong);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.check.checked .box {
  background: var(--wine);
  border-color: var(--wine);
  color: #fff;
}

/* AiYa thinking */
@keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
.thinking { display: inline-flex; gap: 3px; }
.thinking i {
  width: 6px; height: 6px;
  background: var(--wine);
  border-radius: 50%;
  animation: blink 1.4s infinite;
}
.thinking i:nth-child(2) { animation-delay: 0.2s; }
.thinking i:nth-child(3) { animation-delay: 0.4s; }

/* Bubble */
.bubble {
  max-width: 86%;
  padding: 11px 15px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.45;
  word-wrap: break-word;
}
.bubble.ai {
  background: var(--bg-elevated);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid var(--line);
}
.bubble.user {
  background: var(--wine);
  color: #fff;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.bubble .quick {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.bubble .quick .chip {
  background: var(--wine-wash);
  border-color: var(--wine-soft);
  color: var(--wine);
  height: 30px;
  padding: 0 12px;
  font-size: 12px;
}

/* Collection / category strip */
.cat-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -20px;
  padding: 0 20px 4px;
  -webkit-overflow-scrolling: touch;
}
.cat-strip::-webkit-scrollbar { display: none; }
/* Wrap variant — все категории видны без горизонтальной прокрутки */
.cat-strip.cat-strip--wrap {
  flex-wrap: wrap;
  overflow-x: visible;
  margin: 0;
  padding: 0;
  gap: 6px 6px;
}
.cat-strip.cat-strip--wrap .chip {
  height: 30px;
  padding: 0 10px;
  font-size: 12px;
}

/* Hero banner */
.hero {
  border-radius: var(--r-lg);
  padding: 14px 18px;
  background: var(--rose-wash);
  color: var(--wine);
  position: relative;
  overflow: hidden;
}
.hero h2 {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
  font-size: 17px;
  margin: 0 0 3px;
  line-height: 1.1;
  position: relative;
  opacity: 0.75;
}
.hero p {
  font-size: 12px;
  opacity: 0.6;
  margin: 0;
  position: relative;
  line-height: 1.4;
}

/* Главная CTA-кнопка "Составить рецепт" — самая важная кнопка экрана */
.btn-hero-cta {
  position: relative;
  width: 100%;
  min-height: 68px;
  border-radius: 18px;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: linear-gradient(135deg, var(--wine) 0%, var(--wine-deep) 100%);
  color: #fff;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 600;
  font-size: 20px;
  letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(122, 30, 58, 0.38), 0 0 0 4px rgba(122, 30, 58, 0.08);
  animation: heroGlow 2.6s ease-in-out infinite;
}
.btn-hero-cta:active { transform: scale(0.98); }
@keyframes heroGlow {
  0%, 100% { box-shadow: 0 8px 24px rgba(122, 30, 58, 0.38), 0 0 0 4px rgba(122, 30, 58, 0.08); }
  50% { box-shadow: 0 8px 30px rgba(122, 30, 58, 0.55), 0 0 0 9px rgba(122, 30, 58, 0.12); }
}

/* big-stat */
.big-stat { text-align: center; padding: 14px; }
.big-stat .v {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1;
}
.big-stat .l {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

/* font scale presets */
:root[data-fontscale="md"] { font-size: 16px; }
:root[data-fontscale="lg"] { font-size: 18px; }

/* iOS PWA safe area */
@media (display-mode: standalone), (display-mode: fullscreen) {
  body { background: #ece1d4; }
  .screen { padding-top: max(16px, env(safe-area-inset-top)); }
}

/* Поиск + избранное */
.search-bar {
  display: flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 14px;
  border-radius: var(--r-pill);
  background: var(--bg-elevated);
  border: 1px solid var(--line);
}
.search-bar input {
  flex: 1; border: 0; background: transparent;
  font-size: 15px; color: var(--ink); outline: none;
  font-family: inherit;
}
.fav-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3); background: transparent;
  flex-shrink: 0;
}
.fav-btn.active { color: var(--wine); }
.fav-btn:active { background: var(--wine-wash); }


/* Site wrapper — max-width 480px centered */
#canvas-wrap {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  box-shadow: 0 0 0 1px rgba(43,21,26,0.06), 0 0 60px rgba(43,21,26,0.08);
}
@media (max-width: 480px) {
  #canvas-wrap { box-shadow: none; }
}

  <div id="loading-splash" style="position:fixed;inset:0;background:#ece1d4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;font-family:sans-serif;">
    <div style="width:64px;height:64px;border-radius:50%;background:#6b1f2c;display:flex;align-items:center;justify-content:center;color:#f4ece1;font-size:26px;font-style:italic;font-weight:700;">АЯ</div>
    <div style="font-size:15px;color:#6b1f2c;font-weight:600;">Загрузка АйЯ...</div>
    <div id="loading-dots" style="display:flex;gap:5px;">
      <span style="width:7px;height:7px;background:#6b1f2c;border-radius:50%;animation:ld 1.2s infinite;display:inline-block;"></span>
      <span style="width:7px;height:7px;background:#6b1f2c;border-radius:50%;animation:ld 1.2s 0.2s infinite;display:inline-block;opacity:0.3;"></span>

      Не удалось загрузить React.<br>Проверьте подключение к интернету и обновите страницу.

    <style>@keyframes ld{0%,80%,100%{opacity:0.3}40%{opacity:1}}</style>
  </div>
  <div id="root"></div>
  <script>
    // Show error if React doesn't load in 12 seconds
    setTimeout(function(){
      var s = document.getElementById('loading-splash');
      if(s && s.style.display !== 'none'){
        document.getElementById('loading-error').style.display = 'block';
        document.getElementById('loading-dots').style.display = 'none';
      }
    }, 12000);
  </script>

  <!-- React 18 + Babel — multi-CDN fallback для работы в России -->
  <script>
  // Загружает скрипт с fallback на следующий CDN при ошибке
  function loadScript(urls, onSuccess, onFail) {
    if (!urls.length) { onFail && onFail(); return; }
    var s = document.createElement('script');
    s.src = urls[0];
    s.onload = function() { onSuccess && onSuccess(); };
    s.onerror = function() { loadScript(urls.slice(1), onSuccess, onFail); };
    document.head.appendChild(s);
  }

  var REACT_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js',
    'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
    'https://unpkg.com/react@18.3.1/umd/react.production.min.js'
  ];
  var REACTDOM_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js',
    'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
    'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js'
  ];
  var BABEL_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.29.0/babel.min.js',
    'https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.0/babel.min.js',
    'https://unpkg.com/@babel/standalone@7.29.0/babel.min.js'
  ];

  function showCdnError() {
    var el = document.getElementById('loading-error');
    var dots = document.getElementById('loading-dots');
    if (el) el.style.display = 'block';
    if (dots) dots.style.display = 'none';
    var msg = document.createElement('div');
    msg.style.cssText = 'font-size:11px;color:#836870;margin-top:10px;text-align:center;padding:0 20px;line-height:1.6;';
    msg.innerHTML = 'Попробуйте открыть через VPN<br>или запустите локальный сервер:<br><code style="background:#e8d8c8;padding:2px 6px;border-radius:4px;font-size:11px;">python3 -m http.server 8080</code>';
    var splash = document.getElementById('loading-splash');
    if (splash) splash.appendChild(msg);
  }

  // Цепочка загрузки: React → ReactDOM → Babel → готово
  loadScript(REACT_URLS,
    function() {
      loadScript(REACTDOM_URLS,
        function() {
          loadScript(BABEL_URLS, function() {
          // Babel loaded async - need to manually trigger compilation
          if (typeof Babel !== 'undefined' && Babel.transformScriptTags) {
            Babel.transformScriptTags();
          }
        }, showCdnError);
        },
        showCdnError
      );
    },
    showCdnError
  );
  </script>

  const [favs, setFavs] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('prosalon_favs') || '[]'); } catch { return []; }
  });
  const toggleFav = (code) => {
    setFavs(prev => {
      const next = prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code];
      try { localStorage.setItem('prosalon_favs', JSON.stringify(next)); } catch {}
      return next;
    });
  };
  return [favs, toggleFav];
}
window.useFavorites = useFavorites;

  <!-- Клиенты: история рецептов (localStorage CRM) -->
  <script type="text/babel">
const CLIENTS_KEY = 'prosalon_clients_v1';
const RECIPES_KEY = 'prosalon_client_recipes_v1';

function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); }
  catch { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

const ClientsStore = {
  getClients() { return loadJSON(CLIENTS_KEY, []); },

  findOrCreateClient(name, tag) {
    const clients = this.getClients();
    const clean = (name || '').trim();
    if (!clean) return null;
    let c = clients.find(c => c.name.toLowerCase() === clean.toLowerCase());
    if (!c) {
      c = { id: 'c_' + Date.now(), name: clean, tag: (tag || '').trim(), createdAt: new Date().toISOString() };
      clients.push(c);
      saveJSON(CLIENTS_KEY, clients);
    } else if (tag && tag.trim() && c.tag !== tag.trim()) {
      c.tag = tag.trim();
      saveJSON(CLIENTS_KEY, clients);
    }
    return c;
  },

  searchClients(query) {
    const q = (query || '').trim().toLowerCase();
    const clients = this.getClients();
    if (!q) return clients;
    return clients.filter(c => c.name.toLowerCase().includes(q) || (c.tag || '').toLowerCase().includes(q));
  },

  getAllRecipes() { return loadJSON(RECIPES_KEY, []); },

  addRecipe(clientId, summary, lab) {
    const recipes = this.getAllRecipes();
    const rec = {
      id: 'r_' + Date.now(),
      clientId,
      date: new Date().toISOString(),
      summary,
      lab: lab || null,
      liked: '',
      mistakes: '',
    };
    recipes.push(rec);
    saveJSON(RECIPES_KEY, recipes);
    return rec;
  },

  getRecipesForClient(clientId) {
    return this.getAllRecipes()
      .filter(r => r.clientId === clientId)
      .sort((a, b) => new Date(b.date) - new Date(a.date));
  },

  updateRecipeNotes(recipeId, liked, mistakes) {
    const recipes = this.getAllRecipes();
    const r = recipes.find(r => r.id === recipeId);
    if (!r) return;
    r.liked = liked;
    r.mistakes = mistakes;
    saveJSON(RECIPES_KEY, recipes);
  },

  createClient(name, tag) {
    const clean = (name || '').trim();
    if (!clean) return null;
    const clients = this.getClients();
    if (clients.find(c => c.name.toLowerCase() === clean.toLowerCase())) return null; // уже есть
    const c = { id: 'c_' + Date.now(), name: clean, tag: (tag || '').trim(), createdAt: new Date().toISOString() };
    clients.push(c);
    saveJSON(CLIENTS_KEY, clients);
    return c;
  },

  renameClient(clientId, newName, newTag) {
    const clients = this.getClients();
    const c = clients.find(c => c.id === clientId);
    if (!c) return null;
    if (newName && newName.trim()) c.name = newName.trim();
    c.tag = (newTag || '').trim();
    saveJSON(CLIENTS_KEY, clients);
    return c;
  },

  deleteClient(clientId) {
    const clients = this.getClients().filter(c => c.id !== clientId);
    saveJSON(CLIENTS_KEY, clients);
    const recipes = this.getAllRecipes().filter(r => r.clientId !== clientId);
    saveJSON(RECIPES_KEY, recipes);
  },
};
window.ClientsStore = ClientsStore;

function formatClientDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })
      + ' · ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}
window.formatClientDate = formatClientDate;

// Кнопка "Сохранить клиенту" — размещается на экране рецепта
function SaveRecipeButton({ summary, lab }) {
  const [open, setOpen] = React.useState(false);
  const [query, setQuery] = React.useState('');
  const [tag, setTag] = React.useState('');
  const [saved, setSaved] = React.useState(false);

  function handleSave(nameOverride) {
    const name = nameOverride || query;
    if (!name.trim()) return;
    const client = ClientsStore.findOrCreateClient(name, tag);
    if (client) {
      ClientsStore.addRecipe(client.id, summary, lab);
      setSaved(true);
      setTimeout(() => { setOpen(false); setSaved(false); setQuery(''); setTag(''); }, 1100);
    }
  }

  if (!open) {
    return (
      <button className="card" onClick={() => setOpen(true)}
        style={{display: 'flex', alignItems: 'center', gap: 10, padding: 12, textAlign: 'left', cursor: 'pointer', borderStyle: 'dashed'}}>
        <span style={{width: 34, height: 34, borderRadius: 9, background: 'var(--gold-wash)', color: 'var(--wine)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0}}>👤</span>
        <div style={{flex: 1}}>
          <div style={{fontWeight: 700, fontSize: 13}}>Сохранить рецепт клиенту</div>
          <div style={{fontSize: 11, color: 'var(--ink-3)', marginTop: 1}}>в историю — по имени или тегу</div>
        </div>
      </button>
    );
  }

  return (
    <div className="card" style={{padding: 14}}>
      {saved ? (
        <div style={{textAlign: 'center', padding: '8px 0', color: 'var(--success)', fontWeight: 700, fontSize: 14}}>✓ Сохранено в историю клиента</div>
      ) : (
        <>
          <div style={{fontWeight: 700, fontSize: 13, marginBottom: 8}}>Сохранить рецепт клиенту</div>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Имя клиента"
            style={{width: '100%', height: 40, borderRadius: 10, border: '1px solid var(--line)', padding: '0 12px', fontSize: 14, marginBottom: 8}}/>
          {matches.length > 0 && (
            <div style={{display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 8}}>
              {matches.map(c => (
                <button key={c.id} onClick={() => handleSave(c.name)}
                  style={{textAlign: 'left', padding: '8px 10px', borderRadius: 8, background: 'var(--bg-soft)', fontSize: 13, cursor: 'pointer'}}>
                  {c.name} {c.tag ? <span style={{color: 'var(--ink-3)'}}>· {c.tag}</span> : null}
                </button>
              ))}
            </div>
          )}
          <input value={tag} onChange={e => setTag(e.target.value)} placeholder="Тег (необязательно, напр. блонд)"
            style={{width: '100%', height: 40, borderRadius: 10, border: '1px solid var(--line)', padding: '0 12px', fontSize: 14, marginBottom: 10}}/>
          <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8}}>
            <button className="btn" onClick={() => setOpen(false)} style={{height: 40, fontSize: 13}}>Отмена</button>
            <button className="btn btn-primary" onClick={() => handleSave()} style={{height: 40, fontSize: 13}}>Сохранить</button>
          </div>
        </>
      )}
    </div>
  );
}
window.SaveRecipeButton = SaveRecipeButton;

      <div style={{width: 56, height: 56, borderRadius: 16, background: 'rgba(255,255,255,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, flexShrink: 0}}>📁</div>
      <div style={{flex: 1}}>

        <div style={{fontSize: 12, color: 'var(--wine-deep)', marginTop: 2, lineHeight: 1.4}}>История, последние рецепты, повтор окрашивания</div>

// Карточка одного рецепта в истории клиента — с полями "Что понравилось" / "Грабли"
function ClientRecipeCard({ rec, onUpdate, defaultOpen }) {
  const [liked, setLiked] = React.useState(rec.liked || '');
  const [mistakes, setMistakes] = React.useState(rec.mistakes || '');
  const [dirty, setDirty] = React.useState(false);
  const [open, setOpen] = React.useState(!!defaultOpen);

  function commit() {
    if (!dirty) return;
    ClientsStore.updateRecipeNotes(rec.id, liked, mistakes);
    onUpdate && onUpdate();
    setDirty(false);
  }

  return (
    <div className="card" style={{padding: 24, borderRadius: 20}}>
      <button onClick={() => setOpen(o => !o)}
        style={{width: '100%', display: 'flex', alignItems: 'center', gap: 12, background: 'none', border: 'none', padding: 0, cursor: 'pointer', textAlign: 'left'}}>
        <div style={{flex: 1}}>
          <div style={{fontSize: 15, color: 'var(--ink-3)', fontWeight: 600}}>{formatClientDate(rec.date)}</div>
          <div style={{fontSize: 18, fontWeight: 700, color: 'var(--wine)', marginTop: 2}}>
            {rec.lab ? 'Intensis Color Art ' + rec.lab.target : 'Рецепт'}
          </div>
        </div>
        <span style={{fontSize: 22, color: 'var(--ink-3)', transform: open ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s'}}>⌄</span>
      </button>

      {open && (
        <div style={{marginTop: 18}}>
          {rec.lab ? (
            <div style={{display: 'flex', flexDirection: 'column', gap: 14}}>
              <RecipeBody lab={rec.lab}/>
            </div>
          ) : (
            <>
              <div style={{fontSize: 17, lineHeight: 1.5, color: 'var(--ink-2)', marginBottom: 12, whiteSpace: 'pre-line'}}>{rec.summary}</div>
              <div style={{fontSize: 12, color: 'var(--ink-3)', marginBottom: 16, lineHeight: 1.4}}>
                ⓘ Рецепт сохранён до обновления — полный расчёт по зонам недоступен, показан только текст сохранённой заявки
              </div>
            </>
          )}

          <div style={{display: 'flex', flexDirection: 'column', gap: 14, marginTop: 18, borderTop: '1px solid var(--line)', paddingTop: 16}}>
            <div>
              <div style={{fontSize: 15, fontWeight: 700, color: 'var(--success)', marginBottom: 6}}>✓ Что понравилось</div>
              <textarea value={liked} onChange={e => { setLiked(e.target.value); setDirty(true); }} onBlur={commit}
                placeholder="Что сработало хорошо..."
                style={{width: '100%', minHeight: 64, borderRadius: 12, border: '1px solid var(--line)', padding: 12, fontSize: 16, fontFamily: 'inherit', resize: 'vertical'}}/>
            </div>
            <div>
              <div style={{fontSize: 15, fontWeight: 700, color: 'var(--wine)', marginBottom: 6}}>⚠ Грабли — что не делать в следующий раз</div>
              <textarea value={mistakes} onChange={e => { setMistakes(e.target.value); setDirty(true); }} onBlur={commit}
                placeholder="Ошибки и на что обратить внимание..."
                style={{width: '100%', minHeight: 64, borderRadius: 12, border: '1px solid var(--line)', padding: 12, fontSize: 16, fontFamily: 'inherit', resize: 'vertical'}}/>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Экран "Мои клиенты" — поиск, последние 3 рецепта, полная история
function buildClientHistoryText(client, recipes) {
  const lines = [
    `Prosalon · История окрашивания — ${client.name}${client.tag ? ' (' + client.tag + ')' : ''}`,
    `Всего рецептов: ${recipes.length}`,
    '',
  ];
  recipes.forEach(r => {
    lines.push('— ' + formatClientDate(r.date) + ' —');
    lines.push(r.summary || (r.lab ? 'Intensis Color Art ' + r.lab.target : 'рецепт без описания'));
    if (r.liked) lines.push('✓ Понравилось: ' + r.liked);
    if (r.mistakes) lines.push('⚠ Грабли: ' + r.mistakes);
    lines.push('');
  });
  return lines.join('\n');
}

function ScreenClients({ onNav, updateLab, setActiveClient }) {
  const [query, setQuery] = React.useState('');
  const [selected, setSelected] = React.useState(null);
  const [, forceUpdate] = React.useState(0);
  const refresh = () => forceUpdate(n => n + 1);

  const [showAdd, setShowAdd] = React.useState(false);
  const [newName, setNewName] = React.useState('');
  const [newTag, setNewTag] = React.useState('');
  const handleCreate = () => {
    const c = ClientsStore.createClient(newName, newTag);
    if (c) { setShowAdd(false); setNewName(''); setNewTag(''); refresh(); setSelected(c); }
    else alert('Укажите имя клиента, или клиент с таким именем уже есть');
  };

  const [editing, setEditing] = React.useState(false);
  const [editName, setEditName] = React.useState('');
  const [editTag, setEditTag] = React.useState('');
  const startEdit = (c) => { setEditName(c.name); setEditTag(c.tag || ''); setEditing(true); };
  const saveEdit = () => {
    if (!editName.trim()) { alert('Имя не может быть пустым'); return; }
    ClientsStore.renameClient(selected.id, editName, editTag);
    setSelected(prev => ({ ...prev, name: editName.trim(), tag: editTag.trim() }));
    setEditing(false);
    refresh();
  };
  const handleDelete = (c) => {
    if (confirm(`Удалить клиента «${c.name}» и всю историю его рецептов? Это действие нельзя отменить.`)) {
      ClientsStore.deleteClient(c.id);
      setSelected(null);
      refresh();
    }
  };
  const handleShareHistory = (client, recipes) => {
    const text = buildClientHistoryText(client, recipes);
    const fallback = (err) => {
      if (err && err.name === 'AbortError') return; // пользователь сам закрыл системное меню — это не ошибка
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('История скопирована в буфер обмена')).catch(() => alert(text));
      else alert(text);
    };
    if (navigator.share) navigator.share({ title: 'История окрашивания — ' + client.name, text }).catch(fallback);
    else fallback();
  };

  // Единая кнопка "Новое окрашивание" вверху карточки клиента: подхватывает
  // диагностику из последнего рецепта (если есть) как отправную точку и
  // ведёт на диагностику для выбора нового цвета.
  const handleNewColoring = (client, recipes) => {
    if (setActiveClient) setActiveClient({ id: client.id, name: client.name });
    const last = recipes && recipes[0];
    if (last && last.lab && updateLab) updateLab(last.lab);
    onNav('intake');
  };

  const clients = ClientsStore.searchClients(query).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  const grouped = {};
  clients.forEach(c => {
    const letter = c.name.trim().charAt(0).toUpperCase();
    (grouped[letter] = grouped[letter] || []).push(c);
  });
  const letters = Object.keys(grouped).sort((a, b) => a.localeCompare(b, 'ru'));

  if (selected) {
    const recipes = ClientsStore.getRecipesForClient(selected.id);
    const last3 = recipes.slice(0, 3);
    const rest = recipes.slice(3);
    return (
      <div className="screen">
        <AppBar onBack={() => { setSelected(null); setEditing(false); }} title={null}/>

        {/* Единый клиентский блок — инфографика: аватар, имя, счётчик, главное действие */}
        <div className="card" style={{padding: 22, borderRadius: 22, background: 'var(--wine-wash)', border: '1.5px solid var(--rose-gold)'}}>
          {editing ? (
            <div style={{marginBottom: 18}}>
              <input value={editName} onChange={e => setEditName(e.target.value)} placeholder="Имя клиента"
                style={{width: '100%', height: 46, borderRadius: 12, border: '1px solid var(--rose-gold)', padding: '0 14px', fontSize: 16, marginBottom: 8, background: '#fff'}}/>
              <input value={editTag} onChange={e => setEditTag(e.target.value)} placeholder="Тег (необязательно)"
                style={{width: '100%', height: 46, borderRadius: 12, border: '1px solid var(--rose-gold)', padding: '0 14px', fontSize: 16, marginBottom: 10, background: '#fff'}}/>
              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8}}>
                <button onClick={() => setEditing(false)} style={{height: 44, borderRadius: 12, fontSize: 14, fontWeight: 700, background: '#fff', color: 'var(--wine)', border: '1px solid var(--wine)'}}>Отмена</button>
                <button onClick={saveEdit} style={{height: 44, borderRadius: 12, fontSize: 14, fontWeight: 700, background: 'var(--wine)', color: '#fff', border: 'none'}}>Сохранить</button>
              </div>
            </div>
          ) : (
            <div style={{display: 'flex', alignItems: 'center', gap: 16, marginBottom: 18}}>
              <div style={{width: 72, height: 72, borderRadius: 20, background: 'rgba(255,255,255,0.6)', color: 'var(--wine)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontWeight: 800, fontSize: 30}}>
                {selected.name.trim().charAt(0).toUpperCase()}
              </div>
              <div style={{flex: 1, minWidth: 0}}>
                <h1 style={{fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 28, fontWeight: 700, color: 'var(--wine)', margin: 0, lineHeight: 1.1}}>{selected.name}</h1>
                <div style={{fontSize: 14, color: 'var(--wine-deep)', marginTop: 4}}>{selected.tag || 'история рецептов'}</div>
              </div>
              <div style={{textAlign: 'center', flexShrink: 0}}>
                <div style={{fontSize: 30, fontWeight: 800, color: 'var(--wine)', lineHeight: 1}}>{recipes.length}</div>
                <div style={{fontSize: 11, color: 'var(--wine-deep)', marginTop: 2}}>{recipes.length === 1 ? 'рецепт' : recipes.length >= 2 && recipes.length <= 4 ? 'рецепта' : 'рецептов'}</div>
              </div>
            </div>
          )}

          <button onClick={() => handleNewColoring(selected, recipes)}
            style={{width: '100%', height: 64, borderRadius: 16, fontSize: 17, fontWeight: 800, background: 'var(--wine)', color: '#fff', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, boxShadow: '0 6px 16px rgba(122,30,58,0.28)', marginBottom: 10}}>
            <span style={{fontSize: 22}}>🎨</span>
            Новое окрашивание
          </button>

          {!editing && (
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8}}>
              <button onClick={() => startEdit(selected)}
                style={{height: 44, borderRadius: 12, fontSize: 12, fontWeight: 700, background: 'rgba(255,255,255,0.6)', color: 'var(--wine)', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2}}>
                <span style={{fontSize: 16}}>✎</span>Изменить
              </button>
              <button onClick={() => handleShareHistory(selected, recipes)}
                style={{height: 44, borderRadius: 12, fontSize: 12, fontWeight: 700, background: 'rgba(255,255,255,0.6)', color: 'var(--wine)', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2}}>
                <span style={{fontSize: 16}}>↗</span>Переслать
              </button>
              <button onClick={() => handleDelete(selected)}
                style={{height: 44, borderRadius: 12, fontSize: 12, fontWeight: 700, background: 'rgba(255,255,255,0.6)', color: 'var(--danger)', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 2}}>
                <span style={{fontSize: 16}}>🗑</span>Удалить
              </button>
            </div>
          )}
        </div>

        {recipes.length === 0 ? (
          <div className="card" style={{padding: 32, textAlign: 'center', color: 'var(--ink-3)', fontSize: 16}}>
            Пока нет сохранённых рецептов для этого клиента
          </div>
        ) : (
          <>
            <div className="section-label" style={{fontSize: 16}}>Последние рецепты</div>
            <div style={{display: 'flex', flexDirection: 'column', gap: 16}}>
              {last3.map((r, i) => <ClientRecipeCard key={r.id} rec={r} onUpdate={refresh} defaultOpen={i === 0}/>)}
            </div>
            {rest.length > 0 && (
              <>
                <div className="section-label" style={{fontSize: 16}}>Вся история</div>
                <div style={{display: 'flex', flexDirection: 'column', gap: 16}}>
                  {rest.map(r => <ClientRecipeCard key={r.id} rec={r} onUpdate={refresh}/>)}
                </div>
              </>
            )}
          </>
        )}
        <div style={{height: 24}}/>
      </div>
    );
  }

  return (
    <div className="screen">
      <AppBar onBack={() => onNav('home')} title={<>Мои <em>клиенты</em></>} sub="адресная книга с рецептами"/>
      <div style={{display: 'flex', gap: 8}}>
        <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Поиск по имени или тегу..."
          style={{flex: 1, height: 60, borderRadius: 16, border: '1.5px solid var(--line)', padding: '0 18px', fontSize: 18}}/>
        <button onClick={() => setShowAdd(o => !o)}
          style={{width: 60, height: 60, borderRadius: 16, background: 'var(--wine)', color: '#fff', border: 'none', fontSize: 28, fontWeight: 700, flexShrink: 0, cursor: 'pointer'}}>
          {showAdd ? '×' : '+'}
        </button>
      </div>

      {showAdd && (
        <div className="card" style={{padding: 16, background: 'var(--gold-wash)', border: '1.5px solid var(--gold)'}}>
          <div style={{fontWeight: 700, fontSize: 15, marginBottom: 10}}>Новый клиент</div>
          <input value={newName} onChange={e => setNewName(e.target.value)} placeholder="Имя клиента"

          <input value={newTag} onChange={e => setNewTag(e.target.value)} placeholder="Тег (необязательно)"
            style={{width: '100%', height: 46, borderRadius: 12, border: '1px solid var(--gold)', padding: '0 14px', fontSize: 16, marginBottom: 10, background: '#fff'}}/>
          <button onClick={handleCreate}
            style={{width: '100%', height: 46, borderRadius: 12, fontSize: 14, fontWeight: 700, background: 'var(--wine)', color: '#fff', border: 'none'}}>
            Создать карточку
          </button>
        </div>
      )}

      {clients.length === 0 ? (
        <div className="card" style={{padding: 32, textAlign: 'center', color: 'var(--ink-3)', fontSize: 16, lineHeight: 1.5}}>
          {query.trim() ? 'Клиенты не найдены' : 'Пока нет сохранённых клиентов — добавьте вручную или сохраните первый рецепт на экране «Рецепт»'}
        </div>
      ) : (
        letters.map(letter => (
          <React.Fragment key={letter}>
            <div className="section-label" style={{fontSize: 15, fontWeight: 800, color: 'var(--wine)'}}>{letter}</div>
            <div style={{display: 'flex', flexDirection: 'column', gap: 14, marginBottom: 4}}>
              {grouped[letter].map(c => {
                const recipes = ClientsStore.getRecipesForClient(c.id);
                const lastDate = recipes[0] ? formatClientDate(recipes[0].date) : '';
                return (
                  <div key={c.id} className="card" style={{padding: 20, borderRadius: 18, display: 'flex', alignItems: 'center', gap: 16, cursor: 'pointer'}} onClick={() => setSelected(c)}>
                    <div style={{width: 60, height: 60, borderRadius: 16, background: 'var(--wine-wash)', color: 'var(--wine)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontWeight: 800, fontSize: 24}}>
                      {c.name.trim().charAt(0).toUpperCase()}
                    </div>
                    <div style={{flex: 1, minWidth: 0}}>
                      <div style={{fontWeight: 700, fontSize: 19}}>{c.name}</div>
                      <div style={{fontSize: 14, color: 'var(--ink-3)', marginTop: 4}}>
                        {c.tag ? c.tag + ' · ' : ''}{recipes.length} рец. {lastDate ? '· ' + lastDate : ''}
                      </div>
                    </div>
                    <span style={{color: 'var(--ink-3)', fontSize: 20}}>{Icon.fwd}</span>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        ))
      )}
      <div style={{height: 24}}/>
    </div>
  );
}

function findTipsForProduct(name) {
  if (!name) return [];
  const q = name.toLowerCase();
  return TIPS_DB.filter(t =>

    t.title.toLowerCase().includes(q)

}

window.RECIPE_BOOK = RECIPE_BOOK;

// Стоп-слова — слишком общие, чтобы считать их совпадением по теме
const RECIPE_MATCH_STOPWORDS = new Set([
  'шампунь','кондиционер','маска','крем','спрей','сыворотка','вода','водичка',
  'для','или','под','без','раз','мин','мин.','по','как','это','что','при',
]);

function extractKeywords(text) {
  return (text || '')
    .toLowerCase()
    .replace(/[^а-яёa-z0-9\s]/g, ' ')
    .split(/\s+/)
    .filter(w => w.length >= 4 && !RECIPE_MATCH_STOPWORDS.has(w));
}

// Укорачиваем слово до "основы" (первые 5 букв), чтобы совпадали разные
// окончания одного корня: протеиновая / протеинами / протеинов
function stemRu(word) {
  return word.length > 5 ? word.slice(0, 5) : word;
}

// Точные подтверждённые соответствия "товар каталога → продукт(ы) рецепта".
// Подтверждено Натальей Дубинской (эксперт) и официальным PDF-каталогом
// Chantal/Prosalon в переписке. Проверяется ПЕРВЫМ, до нечёткого поиска
// по ключевым словам — так рецепты находятся точно, а не по совпадению
// случайных слов. catalogMatch — все подстроки должны встретиться в
// названии товара каталога (регистр не важен).
const CONFIRMED_PRODUCT_ALIASES = [
  { catalogMatch: ['pure', 'очищающий шампунь'], recipeProducts: ['Очищающий шампунь ШГО'] },
  { catalogMatch: ['aloe', 'увлажняющая маска'], recipeProducts: ['Маска увлажняющая с алоэ и гранатом'] },
  { catalogMatch: ['tsubaki', 'разглаживающая маска'], recipeProducts: ['Маска с рисом и маслом цубаки'] },
  { catalogMatch: ['colorpeel'], recipeProducts: ['Смывка'] },
  { catalogMatch: ['pink blonde', 'тонирующая маска'], recipeProducts: ['Тонирующая маска (пастельно-розовая)'] },
  { catalogMatch: ['лосьон для укладки'], recipeProducts: ['Сушка с диффузором'] },
  { catalogMatch: ['спрей для придания объёма'], recipeProducts: ['Сушка с диффузором'] },
  { catalogMatch: ['hair beauty', 'ceramides force'], recipeProducts: ['Маска с керамидами'] },
  { catalogMatch: ['botox therapy', 'антиэйджинговая маска'], recipeProducts: ['Маска с керамидами'] },
  { catalogMatch: ['protein therapy', 'восстанавливающий кондиционер'], recipeProducts: ['Кондиционер с протеинами'] },
  { catalogMatch: ['protein therapy', 'восстанавливающая маска'], recipeProducts: ['Маска протеиновая восстанавливающая'] },
  { catalogMatch: ['keratin', 'маска с кератином'], recipeProducts: ['Маска с кератином'] },
  { catalogMatch: ['hair beauty', 'collagen'], recipeProducts: ['Маска с коллагеном и омега 3,6,9'] },
  { catalogMatch: ['hair beauty', 'peptides'], recipeProducts: ['Маска с пептидами и биотином'] },
  { catalogMatch: ['pure & ready', 'detox'], recipeProducts: ['Шампунь-детокс (PUREADY)', 'Шампунь-детокс'] },
  { catalogMatch: ['intensis color art', 'кондиционер'], recipeProducts: ['Кондиционер (по необходимости)'] },
];

// Находит рецепты, где среди продуктов шага встречаются значимые слова
// из названия товара каталога. Возвращает [{section, recipe}, ...]
function findRecipesForProduct(productName) {
  const q = (productName || '').toLowerCase();

  // Шаг 1: сначала — точные подтверждённые соответствия
  const confirmed = CONFIRMED_PRODUCT_ALIASES.find(a => a.catalogMatch.every(m => q.includes(m)));
  if (confirmed) {
    const out = [];
    RECIPE_BOOK.forEach(section => {
      section.recipes.forEach(recipe => {
        const hasProduct = (recipe.products || []).some(p => confirmed.recipeProducts.includes(p));
        if (hasProduct) out.push({ section, recipe });
      });
    });
    if (out.length) return out;
  }

  // Шаг 2: нечёткий поиск по ключевым словам — запасной вариант
  const keywords = extractKeywords(productName).map(stemRu);
  if (!keywords.length) return [];
  const out = [];
  RECIPE_BOOK.forEach(section => {
    section.recipes.forEach(recipe => {
      const haystack = (recipe.products || []).join(' ').toLowerCase();
      const hit = keywords.some(kw => haystack.includes(kw));
      if (hit) out.push({ section, recipe });
    });
  });
  return out;
}

// Модальное окно — полный рецепт поверх экрана
function RecipeModal({ sectionTitle, recipe, onClose }) {

}

// Экран базы советов — рецепты ухода (кнопка → модалка) + общие статьи
function ScreenProTips({ onNav, initialQuery }) {
  const [query, setQuery] = React.useState(initialQuery || '');
  const [activeSlug, setActiveSlug] = React.useState(null);
  const [openRecipe, setOpenRecipe] = React.useState(null); // { section, recipe }

  const q = query.trim().toLowerCase();

  // Режим "фильтр по товару из каталога" активен только пока текст в поле
  // поиска совпадает с тем, что пришло при переходе — как только человек
  // сам что-то печатает, включается обычный текстовый поиск по базе.
  const productFilterActive = !!initialQuery && query === initialQuery;

  // Рецепты, подходящие под поиск/фильтр по продукту
  const productMatches = productFilterActive ? findRecipesForProduct(initialQuery) : [];
  const productMatchIds = new Set(productMatches.map(m => m.recipe.id));

  const filteredBook = RECIPE_BOOK.map(section => {
    const recipes = section.recipes.filter(r => {
      if (productFilterActive) return productMatchIds.has(r.id);
      if (!q) return true;
      return r.title.toLowerCase().includes(q)
        || section.title.toLowerCase().includes(q)
        || (r.products || []).some(p => p.toLowerCase().includes(q));
    });
    return { ...section, recipes };
  }).filter(section => section.recipes.length > 0);

  const filteredArticles = q
    ? TIPS_DB.filter(t => t.title.toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || (t.products||[]).some(p=>p.toLowerCase().includes(q)))
    : (productFilterActive ? [] : TIPS_DB);

  const byCategory = {};
  filteredArticles.forEach(t => { (byCategory[t.category] = byCategory[t.category] || []).push(t); });

  const article = activeSlug ? TIPS_DB.find(t => t.slug === activeSlug) : null;

  if (article) {
    return (
      <div className="screen">
        <AppBar onBack={() => setActiveSlug(null)} title={null}/>
        <div style={{fontSize: 11, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.06em'}}>{article.category}</div>
        <h1 style={{fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 26, fontWeight: 600, color: 'var(--wine)', margin: '2px 0 6px'}}>{article.title}</h1>
        <div style={{fontSize: 13, color: 'var(--ink-2)', lineHeight: 1.5, marginBottom: 8, paddingBottom: 10, borderBottom: '1px solid var(--line)'}}>{article.summary}</div>
        {article.body.map((sec, i) => (
          <div key={i} style={{marginBottom: 14}}>
            <div style={{fontWeight: 700, fontSize: 14, color: 'var(--wine)', marginBottom: 4}}>{sec.h}</div>
            <div style={{fontSize: 13, lineHeight: 1.6, color: 'var(--ink-2)'}}>{sec.p}</div>
          </div>
        ))}
        {article.products && article.products.length > 0 && (
          <>
            <div className="section-label">Связанные продукты</div>
            <div className="card" style={{padding: 12, display: 'flex', flexWrap: 'wrap', gap: 6}}>
              {article.products.map(p => (
                <span key={p} style={{fontSize: 11, padding: '5px 10px', borderRadius: 999, background: 'var(--rose-wash)', color: 'var(--wine)'}}>{p}</span>
              ))}
            </div>
          </>
        )}
        <div style={{height: 24}}/>
      </div>
    );
  }

  return (
    <div className="screen">
      <AppBar onBack={() => onNav('home')} title={<>Советы <em>профи</em></>} sub="рецепты ухода · база знаний"/>
      <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Поиск по рецептам, статьям и продуктам..."
        style={{width: '100%', height: 46, borderRadius: 12, border: '1px solid var(--line)', padding: '0 14px', fontSize: 14, marginBottom: 4}}/>

      {productFilterActive && filteredBook.length === 0 && filteredArticles.length === 0 && (
        <div className="card" style={{padding: 16, background: 'var(--gold-wash)', border: '1px solid var(--gold)'}}>
          <div style={{fontSize: 13, fontWeight: 700, marginBottom: 4}}>Советов по «{initialQuery}» пока не нашлось</div>
          <div style={{fontSize: 12, color: 'var(--ink-2)', lineHeight: 1.4}}>Названия у эксперта и в каталоге не всегда совпадают дословно — ищем по ключевым словам. Ниже — вся база советов.</div>
        </div>
      )}

      {productFilterActive && filteredBook.length > 0 && (
        <div style={{fontSize: 12, color: 'var(--ink-3)', margin: '2px 0 4px'}}>Рецепты с «{initialQuery}»:</div>
      )}

      {!productFilterActive && q && filteredBook.length === 0 && filteredArticles.length === 0 && (
        <div className="card" style={{padding: 20, textAlign: 'center', color: 'var(--ink-3)', fontSize: 13}}>
          По запросу «{query}» ничего не нашлось. Попробуйте другое слово — например, название раздела, оттенка или продукта.
        </div>
      )}

      {filteredBook.map(section => (
        <React.Fragment key={section.id}>
          <div className="section-label">{section.title}</div>
          <div className="card" style={{padding: 0, overflow: 'hidden'}}>
            {section.recipes.map((r, i, arr) => (
              <button key={r.id} onClick={() => setOpenRecipe({ section, recipe: r })}
                style={{
                  width: '100%', textAlign: 'left', padding: '12px 14px', display: 'flex', alignItems: 'center', gap: 10,
                  borderBottom: i < arr.length - 1 ? '1px solid var(--line)' : 0, cursor: 'pointer',
                }}>
                <div style={{flex: 1}}>
                  <div style={{fontWeight: 700, fontSize: 14, color: 'var(--wine)'}}>{r.title}</div>
                  {r.indication && <div style={{fontSize: 11, color: 'var(--ink-3)', marginTop: 2, lineHeight: 1.4}}>{r.indication.slice(0, 80)}{r.indication.length > 80 ? '…' : ''}</div>}
                </div>
                <span style={{color: 'var(--ink-3)', fontSize: 18, flexShrink: 0}}>{Icon.fwd}</span>
              </button>
            ))}
          </div>
        </React.Fragment>
      ))}

      {!productFilterActive && Object.keys(byCategory).length > 0 && (
        <>
          <div className="section-label" style={{fontSize: 16, marginTop: 12}}>Общие статьи</div>
          {Object.keys(byCategory).map(cat => (
            <React.Fragment key={cat}>
              <div className="section-label">{cat}</div>
              <div className="card" style={{padding: 0, overflow: 'hidden'}}>
                {byCategory[cat].map((t, i, arr) => (
                  <button key={t.slug} onClick={() => setActiveSlug(t.slug)}
                    style={{
                      width: '100%', textAlign: 'left', padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 3,
                      borderBottom: i < arr.length - 1 ? '1px solid var(--line)' : 0, cursor: 'pointer',
                    }}>
                    <div style={{fontWeight: 700, fontSize: 14, color: 'var(--wine)'}}>{t.title}</div>
                    <div style={{fontSize: 12, color: 'var(--ink-3)', lineHeight: 1.4}}>{t.summary}</div>
                  </button>
                ))}
              </div>
            </React.Fragment>
          ))}
        </>
      )}

      {!q && !productFilterActive && filteredBook.length === 0 && Object.keys(byCategory).length === 0 && (
        <div className="card" style={{padding: 20, textAlign: 'center', color: 'var(--ink-3)', fontSize: 13}}>Ничего не найдено</div>
      )}

      {openRecipe && (
        <RecipeModal sectionTitle={openRecipe.section.title} recipe={openRecipe.recipe} onClose={() => setOpenRecipe(null)}/>
      )}

      <div style={{height: 24}}/>
    </div>
  );
}
window.ScreenProTips = ScreenProTips;
  </script>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

function TweakToggle({ label, value, onChange }) {
  return (

      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {

  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,

function ShadeOrderRow({ s, isFav, onToggleFav, onAddToCart }) {

  const [qty, setQty] = React.useState(1);
  const [added, setAdded] = React.useState(false);

  const handleConfirm = (e) => {

      </button>
      {added ? (
        <span style={{fontSize: 11, fontWeight: 700, color: 'var(--success)', flexShrink: 0}}>✓ добавлено</span>
      ) : ordering ? (
        <div style={{display: 'flex', alignItems: 'center', gap: 4, flexShrink: 0}} onClick={e => e.stopPropagation()}>
          <div style={{display: 'flex', alignItems: 'center', border: '1px solid var(--line)', borderRadius: 6, overflow: 'hidden'}}>
            <button onClick={() => setQty(q => Math.max(1, q - 1))} style={{width: 24, height: 26, background: 'var(--bg-soft)', fontSize: 14, fontWeight: 700}}>−</button>
            <span style={{width: 20, textAlign: 'center', fontSize: 12, fontWeight: 700}}>{qty}</span>
            <button onClick={() => setQty(q => q + 1)} style={{width: 24, height: 26, background: 'var(--bg-soft)', fontSize: 14, fontWeight: 700}}>+</button>
          </div>
          <button onClick={handleConfirm} style={{height: 26, padding: '0 10px', borderRadius: 6, fontSize: 11, fontWeight: 700, background: 'var(--wine)', color: '#fff'}}>ОК</button>

        <button onClick={() => setOrdering(true)} style={{flexShrink: 0, height: 28, padding: '0 12px', borderRadius: 999, fontSize: 11, fontWeight: 700, background: 'var(--wine-wash)', color: 'var(--wine)', border: '1px solid var(--wine-soft)'}}>
          Заказать
        </button>
      )}
    </div>
  );
}

// Ищет точное совпадение суффикса после "/", затем — по уменьшающейся длине подстроки.
function getIntensisPigments(shadeCode) {
  if (!shadeCode) return null;
  const parts = String(shadeCode).split('/');
  if (parts.length < 2) return null;
  const suffix = parts[parts.length - 1].trim();
  if (INTENSIS_PIGMENTS[suffix]) return INTENSIS_PIGMENTS[suffix];
  // подбор по убыванию длины подстроки (для составных/нераспознанных кодов)
  for (let len = suffix.length - 1; len >= 1; len--) {
    const candidate = suffix.slice(0, len);
    if (INTENSIS_PIGMENTS[candidate]) return INTENSIS_PIGMENTS[candidate];
  }
  return null;
}

// Шкала активаторов
const OX_LADDER = ['1.9%', '3%', '6%', '9%', '12%'];
function downOx(ox) {
  const i = OX_LADDER.indexOf(ox);
  return i > 0 ? OX_LADDER[i - 1] : ox;
}

// Направление нюанса оттенка
function shadeDirection(target) {
  if (!target) return 'neutral';
  const m = String(target).match(/^(\d+)[\/.](\w+)$/);
  if (!m) return 'neutral';
  const nuance = m[2].toLowerCase();
  if (nuance === '0' || nuance === '00') return 'neutral';
  if (/^(1|11|12|13|2|24|32|b1|62)$/.test(nuance)) return 'cool';
  if (/^(3|33|03|035|07|30|g4|04|44|4b|4c|46|5|6|66)$/.test(nuance)) return 'warm';
  return 'neutral';
}

// Является ли целевой оттенок суперблондом (1000/X)
function isSuperblondTarget(target) {
  return /^1000[\/.]/.test(String(target || ''));
}

// ====================================================================
// ОФИЦИАЛЬНЫЙ АЛГОРИТМ V5 — ВЫБОР ОКСИДАНТА
// ====================================================================
// Standard (НБ >= 7):
//   diff <= 0: 3%, 20-30 мин
//   diff = 1: 3%, 35 мин
//   diff = 2: 6%, 35 мин
//   diff = 3: 9%, 40 мин
//   diff >= 4 (superblonde): 12%, 50 мин
// Dense base correction (НБ < 7):
//   НБ < 3, diff >= 1 → 9%
//   НБ 3-5, diff = 1 → 9%; diff >= 2 → 12%
//   НБ 5-6, diff = 1-2 → 9%; diff = 2-3 → 12%
//   НБ 6-7, diff = 1-2 → 9%; diff >= 4 → 12%
//   НБ 7-8, diff >= 4 → 12%
// Gray rule (gray > 20% AND zone = roots): override → 6%, 35 мин

function pickOxidantV5(nb, dt, gray, zone, isCosmetic) {
  const diff = dt - nb;

  // Косметическая база
  if (isCosmetic) {
    if (isSuperblondTarget(String(dt >= 1000 ? '1000/0' : dt + '/0'))) return { ox: '12%', time: 50 };
    if (diff <= 0) return { ox: '3%', time: 30 };
    return { ox: '3%', time: 35 };
  }

  // Суперблонд 1000/ — всегда 12%, 50 мин
  if (dt >= 1000) return { ox: '12%', time: 50 };

  // Gray rule — зона корней с серединой > 20%
  if (zone === 'roots' && gray > 20) return { ox: '6%', time: 35 };

  // Dense base correction (НБ < 7)
  if (nb < 3) {
    if (diff >= 1) return { ox: '9%', time: 40 };
  } else if (nb < 5) {
    if (diff === 1) return { ox: '9%', time: 40 };
    if (diff >= 2) return { ox: '12%', time: 50 };
  } else if (nb < 6) {
    if (diff >= 1 && diff < 2) return { ox: '9%', time: 40 };
    if (diff >= 2 && diff <= 3) return { ox: '12%', time: 50 };
  } else if (nb < 7) {
    if (diff >= 1 && diff <= 2) return { ox: '9%', time: 40 };
    if (diff >= 4) return { ox: '12%', time: 50 };
  }

  // Standard (НБ >= 7 or no dense rule matched)
  if (diff <= 0) return { ox: '3%', time: 25 };
  if (diff === 1) return { ox: '3%', time: 35 };
  if (diff === 2) return { ox: '6%', time: 35 };
  if (diff === 3) return { ox: '9%', time: 40 };
  return { ox: '12%', time: 50 }; // diff >= 4
}

// Тонер V5 — полная таблица нейтрализации (на 60 г краски)
// Правило 25%: макс. 15 г тонера на 60 г краски
const TONER_TABLE = {
  1:    { grams: 9, name: 'Red (Красный)' },
  2:    { grams: 8, name: 'Red (Красный)' },
  3:    { grams: 7, name: 'Green (Зелёный)' },
  4:    { grams: 6, name: 'Green (Зелёный)' },
  5:    { grams: 5, name: 'Blue (Синий) / Green (Зелёный)' },
  6:    { grams: 4, name: 'Blue (Синий)' },
  7:    { grams: 3, name: 'Blue (Синий) + Silver-Grey' },
  8:    { grams: 2, name: 'Silver-Grey (Серебристо-серый)' },
  9:    { grams: 2, name: 'Silver-Grey / Violet' },
  10:   { grams: 2, name: 'Silver-Grey / Violet' },
  1000: { grams: 1, name: 'Silver-Grey (Синий запрещён)' },
};

function pickTonerV5(dt, hasLifting) {
  if (!hasLifting) return null;
  const level = dt >= 1000 ? 1000 : dt;
  const entry = TONER_TABLE[level];
  if (!entry) return null;
  return `${entry.name} · ${entry.grams} г на 60 г краски`;
}

// Gray mix formula (Таблица 2)
// gray 0-20%: no addition
// gray 21-40%: 30% /0 + 70% target
// gray 41-60%: 50% /0 + 50% target
// gray 61-80%: 70% /0 + 30% target
// gray 81-100%: REPIGMENTATION required
function grayMixFormula(gray) {
  if (gray <= 20) return null;
  if (gray <= 40) return { zeroPercent: 30, targetPercent: 70 };
  if (gray <= 60) return { zeroPercent: 50, targetPercent: 50 };
  if (gray <= 80) return { zeroPercent: 70, targetPercent: 30 };
  return { repigmentation: true };
}

// ====================================================================
// ГЛАВНАЯ ФУНКЦИЯ — ТРИ ЗОНЫ + ОБЪЕДИНЕНИЕ + СВОДКА (V5)
// ====================================================================
function ayaCalculateZones(lab) {
  const { nb_roots, nb_mid, nb_ends,
          cb_roots, cb_mid, cb_ends,
          dt: dtRaw, gray: grayRaw, porosity, target } = lab;
  const dt = parseInt(dtRaw);
  const gray = parseInt(grayRaw);

  const targetLevel = dt >= 1000 ? 1000 : dt;
  const isSuperblond = isSuperblondTarget(target);
  const zoneNBs = { roots: nb_roots, mid: nb_mid, ends: nb_ends };
  const zoneCBs = { roots: !!cb_roots, mid: !!cb_mid, ends: !!cb_ends };
  const labels = { roots: 'Корни', mid: 'Середина', ends: 'Концы' };

  // Проверяем блокировки
  const blocks = [];
  const warns = [];

  // BLOCK 1: Косметическая база + цель > текущий → двухэтапный протокол
  Object.keys(zoneNBs).forEach(z => {
    if (zoneCBs[z] && dt > zoneNBs[z] && !isSuperblond) {
      blocks.push({
        zone: labels[z],
        isCosmeticBlock: true,
        text: 'Косметическая база. Требуется предварительное обесцвечивание (Обесцвечивающая пудра + 6%, 1:2, до 50 мин), затем тонирование.',
      });
    }
  });

  // BLOCK 3: Серия 1000/ при НБ < 7
  if (isSuperblond && nb_roots < 7) {
    blocks.push({
      zone: 'Корни',
      text: 'Серия 1000/ работает только при НБ ≥ 7. Используйте двухэтапный протокол: обесцвечивание → тонирование с 1.9%.',
    });
  }

  // WARN 2: Натуральная база НБ 1-6, подъём >= 3
  Object.keys(zoneNBs).forEach(z => {
    if (!zoneCBs[z] && zoneNBs[z] <= 6 && (dt - zoneNBs[z]) >= 3) {
      warns.push({
        zone: labels[z],
        text: 'Рекомендуется предварительное обесцвечивание (плотная база).',
      });
    }
  });

  // Расчёт одной зоны
  function calcZone(zoneId, nb, isCosmetic) {
    const zoneGray = (zoneId === 'roots') ? gray : 0;
    const { ox: baseOx, time } = pickOxidantV5(nb, dt, zoneGray, zoneId, isCosmetic);

    // Пористость — понижаем на ступень
    let ox = baseOx;
    if (porosity === 'high') ox = downOx(ox);
    else if (porosity === 'med' && zoneId !== 'roots') ox = downOx(ox);

    const diff = dt - nb;
    const hasLifting = !isCosmetic && diff > 0;

    // Тонер зоны
    const tonerText = pickTonerV5(dt, hasLifting);

    // Смесь по седине (только корни)
    const grayMix = (zoneId === 'roots') ? grayMixFormula(gray) : null;

    // Пропорция
    const ratio = isSuperblond ? '1:2 (60г краски : 120г оксиданта)' : '1:1,5 (60г краски : 90г оксиданта)';

    return {
      zone: zoneId,
      nb, dt, ox, time, hasLifting, diff,
      isCosmetic, tonerText, grayMix, ratio,
      formula: isSuperblond ? `Intensis Color Art ${target}` : `Intensis Color Art ${target}`,
    };
  }

  const byZone = {
    roots: calcZone('roots', nb_roots, !!cb_roots && dt > nb_roots),
    mid:   calcZone('mid',   nb_mid,   !!cb_mid && dt > nb_mid),
    ends:  calcZone('ends',  nb_ends,  !!cb_ends && dt > nb_ends),
  };

  // Сигнатура для объединения зон
  function zoneSig(z) {
    const r = byZone[z];
    return [r.ox, r.time, r.tonerText || '', r.grayMix ? JSON.stringify(r.grayMix) : '', r.isCosmetic ? '1' : '0'].join('|');
  }

  const groups = [];
  const zones = ['roots', 'mid', 'ends'];
  let i = 0;
  while (i < zones.length) {
    let j = i;
    const sig = zoneSig(zones[i]);
    while (j + 1 < zones.length && zoneSig(zones[j + 1]) === sig) j++;
    const groupZones = zones.slice(i, j + 1);
    groups.push({
      zones: groupZones,
      title: groupZones.map(z => labels[z]).join(' · '),
      rec: byZone[zones[i]],
    });
    i = j + 1;
  }

  const anyLift = zones.some(z => byZone[z].hasLifting);
  const care = {
    salon: 'Нанесение на сухие волосы. Color Art Protective Oil на кожу головы перед процедурой. После — шампунь и кондиционер Color Art (pH-фиксация).',
    home:  '(Intensis Color, красная) Шампунь и маска для окрашенных волос. (Liquid Keratin, зелёная) Спрей-уход с кератином.',
    lipid: 'После обесцвечивания обязателен коктейль масок: Ниоцинамид + Ботекс + Кератин · 10 мин под тепло.',
  };

  return { blocks, warns, groups, byZone, anyLift, care, inputs: lab, gray, dt, target, isSuperblond };
}

// Backward-compat
function ayaCalculate({ nb, cb, dt, gray }) {
  return ayaCalculateZones({
    nb_roots: nb, nb_mid: nb, nb_ends: nb,
    cb_roots: !!cb, cb_mid: false, cb_ends: false,
    dt, gray, porosity: 'low', target: dt + '/0',
  });
}
