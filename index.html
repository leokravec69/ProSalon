  const [zone, setZone] = React.useState('roots');
  const ZONES = [
    { id: 'roots', label: 'Корни',    short: 'Корни'   },
    { id: 'mid',   label: 'Середина', short: 'Серед.'  },
    { id: 'ends',  label: 'Концы',    short: 'Концы'   },
  ];
  const nbKey = 'nb_' + zone;
  const cbKey = 'cb_' + zone;
  const nbVal = lab[nbKey];
  const cbVal = lab[cbKey];

  // Автоопределение косметической базы: если корни СВЕТЛЕЕ середины/концов —
  // значит середина/концы уже были окрашены (иначе природа не даёт такой разницы
  // в обратную сторону роста). Автоматически переключаем ползунок НБ→КБ и не даём
  // выключить его вручную, пока это условие сохраняется.
  const autoCBMid = lab.nb_roots > lab.nb_mid;
  const autoCBEnds = lab.nb_roots > lab.nb_ends;
  React.useEffect(() => {
    const patch = {};
    if (autoCBMid && !lab.cb_mid) patch.cb_mid = true;
    if (autoCBEnds && !lab.cb_ends) patch.cb_ends = true;
    if (Object.keys(patch).length) updateLab(patch);
  }, [lab.nb_roots, lab.nb_mid, lab.nb_ends, lab.cb_mid, lab.cb_ends]);

  const isAutoZone = (zone === 'mid' && autoCBMid) || (zone === 'ends' && autoCBEnds);

  return (
    <>
      <div className="screen">
        <AppBar onBack={() => onNav('home')} title={<>Диагностика <em>волос</em></>} sub="Шаг 1 из 3 · по зонам"/>

          {ZONES.map(z => {

            return (
              <button key={z.id} className={zone === z.id ? 'active' : ''} onClick={() => setZone(z.id)}>
                {z.short} · {lab['cb_' + z.id] ? 'КБ' : 'НБ'}{lab['nb_' + z.id]}{zAuto ? ' 🔒' : ''}
              </button>
            );
          })}
        </div>

        {/* Зона: база + УГТ в одном блоке */}
        <div className="card">
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10}}>
            <label className="lbl" style={{margin: 0}}>База — {ZONES.find(z => z.id === zone).label.toLowerCase()}</label>
            <div style={{display: 'inline-flex', background: 'var(--bg-soft)', borderRadius: 999, padding: 2, gap: 2}}>
              {COSMETIC_OPTIONS.map(o => (
                <button key={String(o.v)} disabled={isAutoZone} onClick={() => !isAutoZone && updateLab({[cbKey]: o.v})}
                  style={{
                    padding: '6px 14px', borderRadius: 999, fontSize: 12, fontWeight: 700,
                    cursor: isAutoZone ? 'not-allowed' : 'pointer',
                    opacity: isAutoZone && cbVal !== o.v ? 0.35 : 1,
                    background: cbVal === o.v ? 'var(--wine)' : 'transparent',
                    color: cbVal === o.v ? '#fff' : 'var(--ink-2)',
                    border: 'none',
                  }}>
                  {o.label}
                </button>
              ))}
            </div>
          </div>
          {isAutoZone && (
            <div style={{fontSize: 11, color: 'var(--wine)', background: 'var(--wine-wash)', border: '1px solid var(--rose-gold)', borderRadius: 8, padding: '8px 10px', marginBottom: 10, lineHeight: 1.4}}>
              🔒 Определено автоматически: корни светлее этой зоны — значит здесь косметическая база (ранее окрашено). Ползунок заблокирован.
            </div>

          <div style={{fontSize: 11, color: 'var(--ink-3)', marginBottom: 10, lineHeight: 1.4}}>
            {cbVal
              ? 'Окрашены здесь и сейчас. Краска не осветлит (кроме спецблонда 1000/).'
              : 'Своя пигментация. Возможен подъём ' + (zone === 'roots' ? '+4' : '+2–3') + ' тона.'}
          </div>
          <label className="lbl" style={{fontSize: 11, marginBottom: 6}}>{cbVal ? 'КБ' : 'НБ'} — {cbVal ? 'косметическая' : 'натуральная'} база (уровень тона)</label>

// === 4. Желаемый цвет — визуальная палитра (как ScreenPalette) =====
function ScreenTarget({ onNav, lab, updateLab }) {
  const [group, setGroup] = React.useState('neutral');
  const [cat, setCat] = React.useState('natural');
  const target = lab.target;

  const setTarget = (n) => {
    const lvl = /^1000/.test(n) ? 1000 : (parseInt(n) || 8);
    updateLab({ target: n, dt: lvl });
  };

  // При смене группы — автоматически выбираем первую категорию группы
  const handleGroupChange = (gId) => {
    setGroup(gId);
    const grp = PALETTE_GROUPS.find(g => g.id === gId);
    if (grp && grp.cats.length) {
      const firstCat = grp.cats[0];
      setCat(firstCat);
      const shds = PROSALON_SHADES[firstCat] || [];
      if (shds.length) setTarget(shds[0].n);
    }
  };

  const currentGroup = PALETTE_GROUPS.find(g => g.id === group);
  const catsInGroup = currentGroup ? currentGroup.cats : [];
  const shades = PROSALON_SHADES[cat] || [];

  React.useEffect(() => {
    if (shades.length && !shades.find(s => s.n === target)) setTarget(shades[0].n);
  }, [cat]);

  // Найти имя выбранного оттенка
  let selectedShade = null;
  Object.values(PROSALON_SHADES).forEach(arr => {
    const f = arr.find(s => s.n === target);
    if (f) selectedShade = f;
  });

  // Найти категорию выбранной группы из PROSALON_CATEGORIES
  const catsForGroup = PROSALON_CATEGORIES.filter(c => catsInGroup.includes(c.id));

  return (
    <>
      <div className="screen">
        <AppBar onBack={() => onNav('intake')} title={<>Желаемый <em>цвет</em></>} sub="Шаг 2 из 3 · Intensis Color Art"/>
        <div className="progress"><i style={{width: '66%'}}/></div>

        {/* Текущий выбор */}
        {selectedShade && (
          <div style={{display: 'flex', alignItems: 'center', gap: 14, padding: '12px 16px', borderRadius: 14,
            background: 'var(--wine)', color: '#fff'}}>
            <div style={{width: 48, height: 48, borderRadius: '50%', background: selectedShade.c,
              border: '3px solid rgba(255,255,255,0.4)', flexShrink: 0}}/>
            <div style={{flex: 1}}>
              <div style={{fontWeight: 800, fontSize: 18}}>{selectedShade.n}</div>
              <div style={{fontSize: 13, opacity: 0.85}}>{selectedShade.t}</div>
            </div>
            <span style={{opacity: 0.9}}>{Icon.check}</span>
          </div>
        )}

        {/* Уровень 1: группы */}
        <div style={{display: 'flex', gap: 6, flexWrap: 'wrap'}}>
          {PALETTE_GROUPS.map(g => (
            <button key={g.id}
              onClick={() => handleGroupChange(g.id)}
              style={{
                height: 38, padding: '0 14px', borderRadius: 999,
                fontSize: 13, fontWeight: 700, cursor: 'pointer',
                background: group === g.id ? 'var(--wine)' : 'var(--bg-soft)',
                color: group === g.id ? '#fff' : 'var(--ink-2)',
                border: group === g.id ? '2px solid var(--wine-deep)' : '2px solid var(--line)',
                display: 'inline-flex', alignItems: 'center', gap: 6,
              }}>
              <span style={{width: 8, height: 8, borderRadius: '50%', background: g.color, flexShrink: 0, display: 'inline-block'}}/>
              {g.name}
            </button>
          ))}
        </div>

        {/* Уровень 2: категории внутри группы */}
        {group !== 'super' && (
          <div className="cat-strip" style={{overflowX: 'auto', flexWrap: 'nowrap', WebkitOverflowScrolling: 'touch'}}>
            {catsForGroup.map(c => (
              <button key={c.id} className={'chip' + (cat === c.id ? ' active' : '')} onClick={() => setCat(c.id)}
                style={{flexShrink: 0}}>

        {/* Сетка оттенков — визуальная палитра */}
        <div style={{display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8}}>
          {shades.map(s => {
            const isActive = target === s.n;
            return (
              <button key={s.n} onClick={() => setTarget(s.n)}
                style={{
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6,
                  padding: '10px 6px', borderRadius: 12, cursor: 'pointer',
                  background: isActive ? 'var(--wine-wash)' : 'var(--bg-card)',
                  border: isActive ? '2px solid var(--wine)' : '2px solid var(--line)',

                }}>
                <div style={{
                  width: 46, height: 46, borderRadius: '50%', background: s.c,
                  border: isActive ? '3px solid var(--wine)' : '2px solid #fff',
                  boxShadow: 'var(--sh-1)',

                <div style={{fontWeight: 800, fontSize: 13, color: isActive ? 'var(--wine)' : 'var(--ink)'}}>{s.n}</div>
                <div style={{fontSize: 10, color: 'var(--ink-3)', textAlign: 'center', lineHeight: 1.2}}>{s.t}</div>
              </button>
            );
          })}
        </div>

        <div style={{height: 90}}/>
      </div>
      <div className="dock">
        <button className="btn btn-primary btn-block" onClick={() => onNav('recipe')}>
          <span style={{marginRight: 4}}>✦</span> Получить рецепт {target}
        </button>
      </div>
    </>
  );
}


// Чистая функция расчёта — используется и на экране "Рецепт", и при
// отображении полного рецепта в истории клиента (RecipeBody ниже)
function computeRecipeData(lab) {
  const r = ayaCalculateZones(lab);
  const target = lab.target;
  const gray = r.gray;
  const dt = r.dt;

  let shadeTitle = '';
  Object.values(PROSALON_SHADES).forEach(arr => {
    const f = arr.find(s => s.n === target);
    if (f) shadeTitle = f.t;
  });

  const maxLift = Math.max(
    dt - lab.nb_roots,
    dt - lab.nb_mid,
    dt - lab.nb_ends,
  );
  const anyLift = maxLift > 0 && !r.blocks.length;
  const nbForPigment = lab.nb_roots;
  const targetLevel = dt >= 1000 ? 10 : dt;
  const pigmentInfo = NATURAL_PIGMENTS[targetLevel];

  let targetCat = null;
  Object.keys(PROSALON_SHADES).forEach(cat => {
    if (PROSALON_SHADES[cat].some(s => s.n === target)) targetCat = cat;
  });
  const targetGroupId = targetCat ? CAT_TO_GROUP[targetCat] : null;
  const pigmentContradicts = targetGroupId !== 'warm';

  const hasCB9or10 = (lab.cb_roots && lab.nb_roots >= 9)
    || (lab.cb_mid && lab.nb_mid >= 9)
    || (lab.cb_ends && lab.nb_ends >= 9);
  const targetIsNaturalOrCold = targetGroupId === 'neutral' || targetGroupId === 'cold';
  const showBleachedPigmentWarning = hasCB9or10 && targetIsNaturalOrCold;

  function formatGrayMix(gm, tgt) {
    if (!gm || gm.repigmentation) return null;
    const lvl = /^1000/.test(String(tgt)) ? '10' : String(parseInt(tgt));
    const naturalShade = lvl + '/0';
    return `${tgt} (${gm.targetPercent}%) + ${naturalShade} (${gm.zeroPercent}%)`;
  }

  function formatRecipeBlock(rec, gm) {
    const mixStr = (gm && !gm.repigmentation)
      ? formatGrayMix(gm, target)
      : target;
    const proportion = rec.ratio.includes('1:2') ? '1 : 2' : '1 : 1,5';
    return {
      shade: mixStr,
      ox: rec.ox,
      time: rec.time,
      proportion,
      proportionExample: rec.ratio.includes('1:2')
        ? '(например: 60 г краски : 120 г оксида)'
        : '(например: 60 г краски : 90 г оксида)',
    };
  }

  const shareLines = [
    'Prosalon · Рецепт окрашивания АйЯ NEW_Lev ' + target + (shadeTitle ? ' (' + shadeTitle + ')' : ''),
    (lab.cb_roots ? 'КБ' : 'НБ') + ' ' + lab.nb_roots + '/' + (lab.cb_mid ? 'КБ' : 'НБ') + ' ' + lab.nb_mid + '/' + (lab.cb_ends ? 'КБ' : 'НБ') + ' ' + lab.nb_ends +
    ' · седина ' + GRAY_PRESETS.find(p => p.v === lab.gray)?.label + ' · пористость ' + lab.porosity,
    '',
  ];
  r.groups.forEach(g => {
    const rec = g.rec;
    const gm = rec.grayMix;
    const fmt = formatRecipeBlock(rec, gm);
    shareLines.push(g.title + ': ' + fmt.shade + ' + ' + fmt.ox + ' · ' + fmt.time + ' мин · ' + fmt.proportion);
    if (rec.tonerText) shareLines.push('  тонер: ' + rec.tonerText);
  });
  const shareText = shareLines.join('\n');

  const cosmeticBleachZones = [];
  if (lab.cb_roots && dt > lab.nb_roots) cosmeticBleachZones.push({ zone: 'Корни',    lift: dt - lab.nb_roots });
  if (lab.cb_mid   && dt > lab.nb_mid)   cosmeticBleachZones.push({ zone: 'Середина', lift: dt - lab.nb_mid   });
  if (lab.cb_ends  && dt > lab.nb_ends)  cosmeticBleachZones.push({ zone: 'Концы',    lift: dt - lab.nb_ends  });
  const hasCosmeticBleach = cosmeticBleachZones.length > 0;
  const maxCosmeticLift = hasCosmeticBleach
    ? Math.max(...cosmeticBleachZones.map(z => z.lift))
    : 0;
  const canUseColorpeel = maxCosmeticLift <= 2;
  const zoneNames = cosmeticBleachZones.map(z => z.zone).join(', ');

  return {
    r, target, gray, dt, shadeTitle, maxLift, anyLift, nbForPigment, targetLevel, pigmentInfo,
    targetGroupId, pigmentContradicts, hasCB9or10, showBleachedPigmentWarning, formatRecipeBlock,
    shareText, cosmeticBleachZones, hasCosmeticBleach, maxCosmeticLift, canUseColorpeel, zoneNames,
  };
}
window.computeRecipeData = computeRecipeData;

// Полное тело рецепта (сводка → предупреждения → рецепт по зонам → уход) —

            <span>пористость <b style={{color: 'var(--ink)'}}>{POROSITY_LEVELS.find(p => p.v === lab.porosity)?.label.toLowerCase()}</b></span>
            <span>желание <b style={{color: 'var(--wine)'}}>{target}</b></span>

        {/* КОСМЕТИЧЕСКАЯ БАЗА + ОСВЕТЛЕНИЕ */}

              </div>
            </div>

            {/* Переключатель вариантов — только при 1-2 тонах */}
            {canUseColorpeel && (

                {[
                  { id: 'bleach',    label: '🧴 Обесцвечивание' },
                  { id: 'colorpeel', label: '✦ Colorpeel' },
                ].map(opt => (
                  <button key={opt.id} onClick={() => setPrepMethod(opt.id)}
                    style={{
                      flex: 1, padding: '8px 10px', borderRadius: 10, fontSize: 13,
                      fontWeight: 700, cursor: 'pointer',
                      background: prepMethod === opt.id ? '#b6253a' : '#fff3f4',
                      color: prepMethod === opt.id ? '#fff' : '#b6253a',
                      border: `2px solid ${prepMethod === opt.id ? '#b6253a' : '#f0c0c5'}`,
                    }}>
                    {opt.label}
                  </button>
                ))}
              </div>
            )}

            {/* Вариант 1: Обесцвечивание */}
            {(!canUseColorpeel || prepMethod === 'bleach') && (
              <div style={{background: '#fff3f4', borderRadius: 8, padding: '12px 14px', display: 'flex', flexDirection: 'column', gap: 8}}>
                <div style={{fontSize: 12, fontWeight: 800, color: '#b6253a', textTransform: 'uppercase', letterSpacing: '0.06em'}}>
                  Этап 1 — Обесцвечивание ({cosmeticBleachZones.map(z => z.zone).join(' и ')})
                </div>
                <div style={{fontSize: 13, color: 'var(--ink)', lineHeight: 1.5}}>
                  Обесцвечивающая пудра + 6% · пропорция 1:2 · до 50 мин

                <div style={{fontSize: 12, color: '#b6253a', fontStyle: 'italic'}}>
                  ⚠ Визуальный контроль каждые 10 мин. Смыть при достижении нужного фона.
                </div>
                <div style={{fontSize: 12, fontWeight: 800, color: '#b6253a', textTransform: 'uppercase', letterSpacing: '0.06em', marginTop: 4}}>
                  Этап 2 — Окрашивание
                </div>
                <div style={{fontSize: 13, color: 'var(--ink)', lineHeight: 1.5}}>
                  Color Art {target} + 1,9% · пропорция 1:1,5 · 20 мин
                </div>

                  Этап 1 — Colorpeel ({cosmeticBleachZones.map(z => z.zone).join(' и ')})
                </div>
                <div style={{fontSize: 13, color: 'var(--ink)', lineHeight: 1.5}}>
                  Colorpeel (2×100г) · без аммиака · наносить на сухие волосы · время выдержки по инструкции (обычно 20–30 мин)
                </div>
                <div style={{fontSize: 12, color: '#b6253a', fontStyle: 'italic'}}>
                  Удаляет искусственный пигмент. Можно перекрасить сразу после смывания. Следуйте инструкции препарата.
                </div>
                <div style={{fontSize: 12, fontWeight: 800, color: '#b6253a', textTransform: 'uppercase', letterSpacing: '0.06em', marginTop: 4}}>
                  Этап 2 — Окрашивание

                  Color Art {target} + {maxCosmeticLift === 1 ? '3%' : '6%'} · пропорция 1:1,5 · {maxCosmeticLift === 1 ? '35' : '40'} мин
                </div>
                <div style={{fontSize: 12, color: '#b6253a', fontStyle: 'italic', marginTop: 2}}>
                  Возможно добавление корректора исходя из новой базы.

                <div style={{fontSize: 11, color: 'var(--ink-3)', marginTop: 2, fontStyle: 'italic'}}>

                </div>
              </div>
            )}
          </div>
        )}

        {/* ОСТАЛЬНЫЕ БЛОКИРОВКИ (не КБ) */}
        {r.blocks.filter(b => !b.isCosmeticBlock).map((b, i) => (
          <div key={i} className="tip danger" style={{
            background: '#fde8ea', borderLeft: '4px solid #b6253a',
            color: 'var(--ink)', alignItems: 'flex-start', padding: '12px 14px'
          }}>
            <span style={{fontSize: 16, lineHeight: 1, paddingTop: 1}}>⚠</span>
            <div style={{fontSize: 13, lineHeight: 1.45}}>
              <b>{b.zone}:</b> {b.text}
            </div>
          </div>
        ))}

        {/* ПРЕДУПРЕЖДЕНИЯ */}
        {r.warns.map((w, i) => (
          <div key={i} className="tip" style={{
            background: '#fff3cd', borderLeft: '4px solid var(--warn)',
            color: 'var(--ink)', alignItems: 'flex-start', padding: '10px 12px'

            <span style={{fontSize: 14, lineHeight: 1}}>!</span>
            <div style={{fontSize: 12, lineHeight: 1.45}}>
              <b>{w.zone}:</b> {w.text}

        {/* Принцип прозрачного цвета — холодные нюансы */}
        {(() => {
          const nuance = String(target).split(/[\/\.]/)[1] || '';
          const isCold = /^(1|11|12|13|2|24|32|b1|62)$/i.test(nuance);
          if (!isCold) return null;
          return (
            <div className="tip" style={{background: '#eef2fa', borderLeft: '4px solid #6a7aaa', alignItems: 'flex-start', padding: '10px 12px', color: 'var(--ink)'}}>

              const rec = g.rec;
              const gm = rec.grayMix;
              const isRepigmentation = gm && gm.repigmentation;

                      <div><b>2.</b> Смесь {target} + оксидант 6% <span style={{opacity: 0.7}}>(1:1,5)</span> → нанести поверх на 35 мин → смыть</div>

                      <span style={{fontSize: 10, letterSpacing: '0.1em', textTransform: 'uppercase', opacity: 0.75}}>Рекомендация тонер</span><br/>
                      <b>{rec.tonerText}</b>

                  )}
                </div>
              );
            })}

            {/* Фон осветления — предупреждение о натуральном пигменте */}
            {anyLift && targetLevel <= 9 && pigmentInfo && (
              <div className="tip" style={{background: 'var(--warn-wash)', borderLeft: '4px solid var(--warn)', alignItems: 'flex-start', padding: '10px 12px', color: 'var(--ink)'}}>
                <span style={{fontSize: 14}}>!</span>

                  При необходимости нейтрализовать или усилить цвет воспользуйтесь тонерам.

                </div>

            )}
          </>
        )}

          <div className="kv">
            <span className="ic">{Icon.spray}</span>
            <div style={{flex: 1}}>

            <span className="ic">{Icon.spray}</span>

function ScreenRecipe({ onNav, lab, activeClient }) {
  const target = lab.target;
  let shadeTitle = '';
  Object.values(PROSALON_SHADES).forEach(arr => {
    const f = arr.find(s => s.n === target);
    if (f) shadeTitle = f.t;
  });
  const { shareText } = computeRecipeData(lab);

  // Подсказки из истории клиента (если рецепт открыт через "Новое окрашивание"/"Новый цвет")
  const clientHints = (activeClient && window.ClientsStore)
    ? ClientsStore.getRecipesForClient(activeClient.id).filter(r => r.liked || r.mistakes).slice(0, 3)
    : [];

  return (
    <>
      <div className="screen">
        <AppBar onBack={() => onNav('target')} title={<>Рецепт <em>{target}</em></>}
          sub={'Intensis Color Art' + (shadeTitle ? ' · ' + shadeTitle.toLowerCase() : '')}/>
        <div className="progress"><i style={{width: '100%'}}/></div>

        <SaveRecipeButton summary={shareText} lab={lab}/>

        {activeClient && clientHints.length > 0 && (
          <div className="card" style={{padding: 16, background: 'var(--gold-wash)', border: '1.5px solid var(--gold)'}}>
            <div style={{display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10}}>
              <span style={{width: 34, height: 34, borderRadius: 9, background: 'rgba(255,255,255,0.6)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0}}>💡</span>
              <div style={{fontWeight: 700, fontSize: 14}}>Подсказки из истории — {activeClient.name}</div>
            </div>
            <div style={{display: 'flex', flexDirection: 'column', gap: 10}}>
              {clientHints.map(h => (
                <div key={h.id} style={{borderTop: '1px solid rgba(0,0,0,0.08)', paddingTop: 8}}>
                  <div style={{fontSize: 11, color: 'var(--ink-3)', marginBottom: 4}}>{formatClientDate(h.date)}</div>
                  {h.liked && (
                    <div style={{fontSize: 13, lineHeight: 1.4, marginBottom: 4}}><b style={{color: 'var(--success)'}}>✓ Понравилось:</b> {h.liked}</div>
                  )}
                  {h.mistakes && (
                    <div style={{fontSize: 13, lineHeight: 1.4}}><b style={{color: 'var(--wine)'}}>⚠ Грабли:</b> {h.mistakes}</div>
                  )}
                </div>
              ))}
            </div>
          </div>
        )}

        <RecipeBody lab={lab}/>

        <div style={{height: 90}}/>
      </div>
      <div className="dock">
        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8}}>
          <button className="btn btn-ghost" onClick={() => {
            const fallback = (err) => {
              if (err && err.name === 'AbortError') return; // пользователь сам закрыл системное меню
              if (navigator.clipboard) navigator.clipboard.writeText(shareText).then(() => alert('Рецепт скопирован')).catch(() => alert(shareText));
              else alert(shareText);
            };
            if (navigator.share) navigator.share({title: 'Prosalon · Рецепт ' + target, text: shareText}).catch(fallback);
            else fallback();
          }}>Поделиться</button>
          <button className="btn btn-primary" onClick={() => onNav('home')}>Готово</button>
        </div>
      </div>
    </>
  );
}

              <div style={{flex: 1}}>
                <div style={{fontFamily: 'var(--font-display)', fontStyle: 'italic', fontSize: 22, fontWeight: 600, color: t.c, lineHeight: 1.1}}>{t.name}</div>
                <div style={{fontSize: 11, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.08em', marginTop: 2}}>{t.subt}</div>
                <div style={{fontSize: 13, color: 'var(--ink-2)', marginTop: 8, lineHeight: 1.4}}>{t.desc}</div>
                <div style={{display: 'flex', gap: 12, marginTop: 8, fontSize: 12, color: 'var(--ink-3)'}}>
                  <span>✦ {t.steps} шага</span>
                  <span>{Icon.clock} {t.time}</span>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

// === Дистрибьюторы Prosalon по регионам (укрупнённо) ===========

const DISTRIBUTORS = [
  { id: 'kaliningrad', region: 'Калининградская область', firm: 'ООО «Сирова.Косметик»', contact: '', phone: '(4012) 93-40-83', email: 'sirowa@inbox.ru' },
  { id: 'arkhangelsk',  region: 'Архангельская область (Север)', firm: 'ИП Логунова М.В.', contact: 'Мария Логунова', phone: '+7 921 291-50-80', email: 'logudar@yandex.ru' },
  { id: 'lipetsk',      region: 'Липецкая область (Центр)', firm: 'ИП Кольцов А.А.', contact: 'Елена Кольцова', phone: '+7 919 163-19-35', email: 'planeta.lip@yandex.ru' },
  { id: 'south',        region: 'Южный федеральный округ (в т.ч. Краснодарский край)', firm: 'ИП Назаренко И.А.', contact: 'Ирина Стельмашенко', phone: '+7 903 401-61-46', email: 'orbicom@mail.ru' },
  { id: 'saratov',      region: 'Саратовская область (Поволжье)', firm: 'ИП Фёдоров А.Г.', contact: 'Эльмира Савонина', phone: '(8452) 93-05-37', email: 'evsaratov@mail.ru' },
];
window.DISTRIBUTORS = DISTRIBUTORS;

// === 9. Корзина / заказ ========================================
function ScreenCart({ onNav, cart, removeFromCart, updateCartQty, addToCart, clearCart }) {
  const [sent, setSent] = React.useState(false);
  const [name, setName] = React.useState('');
  const [phone, setPhone] = React.useState('');
  const [city, setCity] = React.useState('');
  const [salon, setSalon] = React.useState('');
  const [distId, setDistId] = React.useState(null);
  const dist = DISTRIBUTORS.find(d => d.id === distId) || null;

  // 3 случайных товара из каталога — пересчитываются один раз при открытии корзины
  const recommended = React.useMemo(() => {
    const flat = buildCatalogFlat();
    const shuffled = [...flat].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 3);
  }, []);

  const buildMsg = () => {
    const lines = cart.map(c => `• ${c.lineName} — ${c.name}${c.size ? ' (' + c.size + ')' : ''} × ${c.qty}`);
    return encodeURIComponent(`Здравствуйте! Хочу заказать продукцию Prosalon:\n${lines.join('\n')}\n\nИмя: ${name}\nТелефон: ${phone}\nГород: ${city}${salon ? '\nСалон: ' + salon : ''}${dist ? '\nДистрибьютор: ' + dist.firm + ' (' + dist.region + ')' : ''}`);
  };
  const buildMailBody = () => {
    const lines = cart.map(c => `• ${c.lineName} — ${c.name}${c.size ? ' (' + c.size + ')' : ''} × ${c.qty}`);
    return encodeURIComponent(`Здравствуйте!\n\nХочу заказать продукцию Prosalon:\n${lines.join('\n')}\n\nИмя: ${name}\nТелефон: ${phone}\nГород: ${city}${salon ? '\nСалон: ' + salon : ''}`);
  };

  if (sent) return (
    <div className="screen" style={{alignItems: 'center', justifyContent: 'center', textAlign: 'center', gap: 20, paddingTop: 60}}>
      <div style={{fontSize: 60}}>✅</div>
      <div style={{fontFamily: 'var(--font-display)', fontSize: 28, fontStyle: 'italic', fontWeight: 600, color: 'var(--wine)'}}>Заявка отправлена!</div>
      <div style={{fontSize: 15, color: 'var(--ink-3)', lineHeight: 1.5}}>Менеджер свяжется с вами в ближайшее рабочее время</div>
      <button className="btn btn-primary" onClick={() => { clearCart(); setSent(false); onNav('home'); }} style={{width: '100%', maxWidth: 300}}>На главную</button>
    </div>
  );

  return (
    <>
      <div className="screen">
        <AppBar onBack={() => onNav('palette')} title={<>Заказ <em>продуктов</em></>} sub={cart.length ? `${cart.reduce((s,c)=>s+c.qty,0)} позиций` : 'корзина пуста'}/>

        {cart.length === 0 ? (
          <div style={{textAlign: 'center', padding: '40px 20px', color: 'var(--ink-3)'}}>
            <div style={{fontSize: 48, marginBottom: 16}}>🛒</div>
            <div style={{fontSize: 16, fontWeight: 600, marginBottom: 8}}>Корзина пуста</div>
            <div style={{fontSize: 14, lineHeight: 1.5, marginBottom: 24}}>Добавьте продукты из каталога, нажав на иконку корзины на карточке товара</div>
            <button className="btn btn-primary" onClick={() => onNav('palette')} style={{width: '100%'}}>Перейти в каталог</button>
          </div>
        ) : (
          <>
            <div className="card" style={{padding: 0, overflow: 'hidden'}}>
              {cart.map((item, i) => (
                <div key={item.id} style={{display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', borderBottom: i < cart.length - 1 ? '1px solid var(--line)' : 0}}>
                  <div style={{width: 44, height: 44, borderRadius: 8, background: 'var(--wine-wash)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, color: 'var(--wine)', fontWeight: 700, fontSize: 12}}>×{item.qty}</div>
                  <div style={{flex: 1, minWidth: 0}}>
                    <div style={{fontSize: 12, fontWeight: 700, color: 'var(--ink)', lineHeight: 1.3}}>{item.name}</div>
                    <div style={{fontSize: 11, color: 'var(--ink-3)', marginTop: 2}}>{item.lineName}{item.size ? ' · ' + item.size : ''}</div>
                  </div>
                  <div style={{display: 'flex', alignItems: 'center', gap: 6, flexShrink: 0}}>
                    <div style={{display: 'flex', alignItems: 'center', border: '1px solid var(--line)', borderRadius: 8, overflow: 'hidden'}}>
                      <button onClick={() => updateCartQty(item.id, -1)} style={{width: 28, height: 28, background: 'var(--bg-soft)', fontSize: 15, fontWeight: 700, color: 'var(--ink-2)', cursor: 'pointer'}}>−</button>
                      <span style={{width: 24, textAlign: 'center', fontSize: 13, fontWeight: 700, color: 'var(--wine)'}}>{item.qty}</span>
                      <button onClick={() => updateCartQty(item.id, 1)} style={{width: 28, height: 28, background: 'var(--bg-soft)', fontSize: 15, fontWeight: 700, color: 'var(--ink-2)', cursor: 'pointer'}}>+</button>
                    </div>
                    <button onClick={() => removeFromCart(item.id)} style={{width: 28, height: 28, borderRadius: '50%', background: 'var(--danger-wash)', color: 'var(--danger)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700, flexShrink: 0}}>×</button>
                  </div>
                </div>
              ))}
            </div>

            <div className="section-label">Ваши данные</div>
            <div className="card" style={{padding: 16, display: 'flex', flexDirection: 'column', gap: 12}}>
              <div>
                <label className="lbl">Имя <span style={{color:'var(--wine)'}}>*</span></label>
                <input className="field" value={name} onChange={e => setName(e.target.value)} placeholder="Ваше имя"/>
              </div>
              <div>
                <label className="lbl">Город <span style={{color:'var(--wine)'}}>*</span></label>
                <input className="field" value={city} onChange={e => setCity(e.target.value)} placeholder="Ваш город"/>
              </div>
              <div>
                <label className="lbl">Телефон <span style={{color:'var(--wine)'}}>*</span></label>
                <input className="field" type="tel" value={phone} onChange={e => setPhone(e.target.value)} placeholder="+7 (___) ___-__-__"/>
              </div>
              <div>
                <label className="lbl">Салон <span style={{fontSize:11, color:'var(--ink-3)'}}>необязательно</span></label>
                <input className="field" value={salon} onChange={e => setSalon(e.target.value)} placeholder="Название салона"/>
              </div>
            </div>

            <div className="section-label">Рекомендуем заказать</div>
            <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8}}>
              {recommended.map((p, i) => (
                <ProductCard key={p.name + i} name={p.name} lineName={p.lineName} color={p.color} size={p.size} note={p.note} isBottle={p.isBottle} onAddToCart={addToCart}/>
              ))}
            </div>

            <div className="section-label">Ваш регион / дистрибьютор</div>
            <div className="card" style={{padding: 12, display: 'flex', flexDirection: 'column', gap: 8}}>
              {DISTRIBUTORS.map(d => (
                <label key={d.id} onClick={() => setDistId(d.id)}
                  style={{
                    display: 'flex', alignItems: 'center', gap: 10, padding: 10, borderRadius: 10, cursor: 'pointer',
                    background: distId === d.id ? 'var(--wine-wash)' : 'transparent',
                    border: `1.5px solid ${distId === d.id ? 'var(--wine)' : 'var(--line)'}`,
                  }}>
                  <div style={{
                    flexShrink: 0, width: 20, height: 20, borderRadius: '50%',
                    border: `2px solid ${distId === d.id ? 'var(--wine)' : 'var(--line)'}`,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {distId === d.id && <div style={{width: 10, height: 10, borderRadius: '50%', background: 'var(--wine)'}}/>}
                  </div>
                  <div style={{flex: 1}}>
                    <div style={{fontSize: 13, fontWeight: 700}}>{d.region}</div>
                    <div style={{fontSize: 11, color: 'var(--ink-3)', marginTop: 1}}>{d.firm}{d.contact ? ' · ' + d.contact : ''}</div>
                  </div>
                </label>
              ))}
              <div style={{fontSize: 11, color: 'var(--ink-3)', marginTop: 2}}>Список дистрибьюторов уточняется — свяжемся, если регион не совпал</div>
            </div>

            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
              <a href={`https://wa.me/79094209997?text=${buildMsg()}`} target="_blank"
                className="btn" style={{textDecoration: 'none', background: '#25D366', color: '#fff', height: 52, fontSize: 15}}>
                WhatsApp
              </a>
              <button className="btn btn-primary" style={{height: 52, fontSize: 15}}
                onClick={() => { if (name && phone && city && dist) { setSent(true); } }}>
                Отправить заявку
              </button>
            </div>
            {dist && (
              <a href={`mailto:${dist.email}?subject=${encodeURIComponent('Заказ Prosalon — ' + dist.region)}&body=${buildMailBody()}`}
                className="btn-text" style={{textAlign: 'center', fontSize: 12, color: 'var(--ink-3)'}}>
                или написать напрямую на {dist.email}
              </a>
            )}
            {(!name || !phone || !city || !dist) && (
              <div style={{fontSize:11, color:'var(--ink-3)', textAlign: 'center', marginTop: -4}}>
                {!dist ? 'Выберите регион/дистрибьютора' : 'Заполните имя, телефон и город'}
              </div>
            )}

            <button className="btn-text" onClick={clearCart} style={{textAlign: 'center', fontSize: 13, color: 'var(--ink-3)', paddingBottom: 4}}>
              Очистить корзину
            </button>
          </>
        )}
      </div>
    </>
  );
}

Object.assign(window, {
  ScreenLanding, ScreenAboutProsalon,
  ScreenHome, ScreenIntake, ScreenTarget,
  ScreenRecipe, ScreenPalette, ScreenPerm, ScreenTherapy, ScreenCart,
  TabBar
});

  </script>

  <!-- App root -->
  <script type="text/babel">
const TWEAK_DEFAULTS = {
  "fontScale": "base",
};

function App() {
  const [current, setCurrent] = React.useState('landing');
  const [cart, setCart] = React.useState([]);
  const [lab, setLab] = React.useState({
    nb_roots: 6, nb_mid: 7, nb_ends: 8,
    cb_roots: false, cb_mid: false, cb_ends: false,
    dt: 8, target: '8/0',
    gray: 0, porosity: 'low',
  });
  const updateLab = (patch) => setLab(prev => ({...prev, ...patch}));
  const [activeClient, setActiveClient] = React.useState(null); // {id, name} — для подсказок из истории на экране рецепта
  const onNav = (screen) => { setCurrent(screen); window.scrollTo(0,0); };

  const addToCart = (item, qty) => {
    const n = Math.max(1, qty || 1);
    setCart(prev => {
      const exists = prev.find(c => c.name === item.name && c.lineName === item.lineName);
      if (exists) return prev.map(c => c.name === item.name && c.lineName === item.lineName ? {...c, qty: c.qty + n} : c);
      return [...prev, {...item, qty: n, id: Date.now()}];
    });
  };
  const removeFromCart = (id) => setCart(prev => prev.filter(c => c.id !== id));
  const updateCartQty = (id, delta) => setCart(prev => prev
    .map(c => c.id === id ? {...c, qty: c.qty + delta} : c)
    .filter(c => c.qty > 0));
  const clearCart = () => setCart([]);
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);

  const [tipQuery, setTipQuery] = React.useState('');
  React.useEffect(() => {
    window.openProTip = (productName) => { setTipQuery(productName || ''); setCurrent('protips'); window.scrollTo(0,0); };
  }, []);

  const screens = {
    landing:        <ScreenLanding onNav={onNav} />,
    home:           <ScreenHome onNav={onNav} />,
    'about-prosalon': <ScreenAboutProsalon onNav={onNav} />,
    intake:         <ScreenIntake onNav={onNav} lab={lab} updateLab={updateLab} />,
    target:         <ScreenTarget onNav={onNav} lab={lab} updateLab={updateLab} />,
    recipe:         <ScreenRecipe onNav={onNav} lab={lab} activeClient={activeClient} />,
    palette:        <ScreenPalette onNav={onNav} addToCart={addToCart} />,
    perm:           <ScreenPerm onNav={onNav} />,
    therapy:        <ScreenTherapy onNav={onNav} />,
    clients:        <ScreenClients onNav={onNav} updateLab={updateLab} setActiveClient={setActiveClient} />,
    protips:        <ScreenProTips onNav={onNav} initialQuery={tipQuery} />,
    cart:           <ScreenCart onNav={onNav} cart={cart} removeFromCart={removeFromCart} updateCartQty={updateCartQty} addToCart={addToCart} clearCart={clearCart} />,
  };


  const TAB_ACTIVE = {
    home: 'home', 'about-prosalon': 'home', clients: 'home',
    intake: 'intake', target: 'intake', recipe: 'intake',
    palette: 'palette', perm: 'palette', therapy: 'palette',
    cart: 'cart',
    protips: 'protips',
  };
  const showTab = ['home','about-prosalon','intake','target','recipe','palette','perm','therapy','cart','clients','protips'].includes(current);

  return (
    <div id="canvas-wrap">
      {screens[current] || screens.home}
      {showTab && <TabBar active={TAB_ACTIVE[current] || 'home'} onNav={onNav} cartCount={cartCount}/>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
// Hide loading splash once React renders
const splash = document.getElementById('loading-splash');
if (splash) splash.style.display = 'none';
  </script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
  </script>
